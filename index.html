<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرك فحص السرعات العالية V12</title>
    <style>
        :root { --neon: #00f2fe; --bg: #050505; --panel: #121212; }
        body { background: var(--bg); color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { width: 90%; max-width: 850px; background: var(--panel); padding: 40px; border-radius: 40px; border: 1px solid #222; text-align: center; }
        .hero-speed { font-size: 10rem; font-weight: 900; background: linear-gradient(180deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 20px 0; font-family: 'Courier New', monospace; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 40px; }
        .stat-card { background: #1a1a1a; padding: 20px; border-radius: 20px; border: 1px solid #333; transition: 0.3s; }
        .stat-card.active { border-color: var(--neon); background: #1d2b2d; transform: translateY(-5px); }
        .stat-val { font-size: 2rem; font-weight: 800; display: block; }
        .stat-label { font-size: 0.7rem; color: #777; font-weight: bold; text-transform: uppercase; }
        .btn-main { margin-top: 40px; background: #fff; color: #000; border: none; padding: 20px 80px; border-radius: 100px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: var(--neon); box-shadow: 0 0 30px var(--neon); }
        #log { margin-top: 20px; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <span style="color:var(--neon); letter-spacing: 5px; font-weight: 900;">REAL-TIME BANDWIDTH</span>
        <div id="main-val" class="hero-speed">0</div>
        <div style="font-size: 1.5rem; color: #444; font-weight: 900; margin-top: -20px;">MBPS</div>

        <div class="stats-grid">
            <div class="stat-card" id="card-ping">
                <span class="stat-label">بينق خامل</span>
                <span id="v-ping" class="stat-val">--</span>
            </div>
            <div class="stat-card" id="card-loaded">
                <span class="stat-label">بينق مثقل</span>
                <span id="v-loaded" class="stat-val">--</span>
            </div>
            <div class="stat-card" id="card-upload">
                <span class="stat-label">سرعة الرفع</span>
                <span id="v-upload" class="stat-val">--</span>
            </div>
        </div>

        <button class="btn-main" id="start-btn" onclick="masterEngine()">ابدأ التحليل</button>
        <div id="log">المحرك جاهز لفحص شبكات الألياف (Fiber)</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
