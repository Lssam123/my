<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V128 | OASIS</title>
    <style>
        /* --- تصميم الواحة V128 --- */
        :root { 
            --primary: #00E5FF; /* سماوي */
            --secondary: #D500F9; /* بنفسجي */
            --accent: #FFD600; /* أصفر */
            --bg: #0d0d12; 
            --surface: #15151a;
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        /* الخلفية */
        .oasis-bg { 
            position: fixed; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            opacity: 0.8; z-index: -1;
        }

        .dashboard { 
            width: 95%; max-width: 500px; padding: 30px; 
            background: rgba(21, 21, 26, 0.95); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); 
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }

        /* شبكة النتائج العلوية */
        .stats-header { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
        }
        .stat-box { display: flex; flex-direction: column; }
        .stat-box:not(:last-child) { border-left: 1px solid rgba(255,255,255,0.1); }
        
        .lbl { font-size: 0.65rem; color: #888; font-weight: bold; margin-bottom: 5px; }
        .val { font-size: 1rem; font-weight: 900; direction: ltr; }
        
        .c-dl { color: var(--primary); } 
        .c-ul { color: var(--secondary); } 
        .c-jit { color: var(--accent); }

        /* منطقة السيرفر */
        .server-zone { display: flex; flex-direction: column; gap: 5px; }
        .server-status { font-size: 0.8rem; color: #aaa; }
        .server-name { font-weight: bold; color: white; font-size: 1rem; }

        /* العداد المركزي */
        .gauge-section { 
            position: relative; width: 260px; height: 260px; margin: 0 auto; 
            /* هنا الحل لمشكلة التداخل: مسافة واضحة */
            margin-bottom: 10px;
        }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-bg { stroke: #222; stroke-width: 12; stroke-linecap: round; fill: none; }
        .track-fg { 
            stroke-width: 12; stroke-linecap: round; fill: none; 
            /* محيط الدائرة 2 * PI * 110 = 691. نحاول عرض 75% منها = 518 */
            stroke-dasharray: 518; stroke-dashoffset: 518; 
            transition: stroke-dashoffset 0.15s ease-out;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .hud-center { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            display: flex; flex-direction: column; align-items: center;
        }
        #speed-display { font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -2px; }
        .unit-display { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .phase-display { font-size: 0.9rem; font-weight: bold; color: var(--primary); margin-top: 5px; }

        /* منطقة البنق المثقل المنفصلة */
        .jitter-panel { 
            background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 50px; 
            align-self: center; border: 1px solid #333; margin-bottom: 10px;
        }
        .jitter-text { font-size: 0.8rem; color: #aaa; }
        .jitter-live { font-size: 1.1rem; font-weight: bold; color: var(--accent); margin-right: 5px; }

        /* الأزرار */
        .actions { display: flex; gap: 10px; }
        .btn-start { 
            flex: 3; padding: 18px; border: none; border-radius: 15px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s;
        }
        .btn-start:hover { background: var(--primary); box-shadow: 0 0 30px var(--primary); }
        .btn-start:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }

        .btn-reset { 
            flex: 1; border: 1px solid #444; background: transparent; border-radius: 15px;
            color: white; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .btn-reset:hover { border-color: var(--secondary); color: var(--secondary); }

    </style>
</head>
<body>
    <div class="oasis-bg"></div>
    <div class="dashboard">
        
        <div class="stats-header">
            <div class="stat-box">
                <span class="lbl">PING</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div class="stat-box">
                <span class="lbl">JITTER</span>
                <span id="res-jitter" class="val c-jit">--</span>
            </div>
            <div class="stat-box">
                <span class="lbl">DOWN</span>
                <span id="res-dl" class="val c-dl">--</span>
            </div>
            <div class="stat-box">
                <span class="lbl">UP</span>
                <span id="res-ul" class="val c-ul">--</span>
            </div>
        </div>

        <div class="server-zone">
            <span class="server-status">السيرفر المحدد تلقائياً:</span>
            <span id="server-name" class="server-name">جاري البحث...</span>
        </div>

        <div class="gauge-section">
            <svg viewBox="0 0 260 260">
                <defs>
                    <linearGradient id="grad-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#2979FF"/></linearGradient>
                    <linearGradient id="grad-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D500F9"/><stop offset="1" stop-color="#FF1744"/></linearGradient>
                </defs>
                <path class="track-bg" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="track-active" class="track-fg" stroke="url(#grad-dl)" d="M 50 210 A 110 110 0 1 1 210 210" />
            </svg>
            <div class="hud-center">
                <div id="speed-display">0.0</div>
                <div class="unit-display">Mbps</div>
                <div id="phase-txt" class="phase-display">جاهز</div>
            </div>
        </div>

        <div class="jitter-panel">
            <span class="jitter-text">استقرار الخط (Loaded): </span>
            <span id="live-jitter" class="jitter-live">--</span>
        </div>

        <div class="actions">
            <button id="start-btn" class="btn-start" onclick="startOasisTest()">بدء الفحص</button>
            <button class="btn-reset" onclick="resetAll()">↺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
