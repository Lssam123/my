<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V89 | NATIVE CORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="mainframe">
        
        <div class="top-memory-bar">
            <div class="mem-slot"><span>Ping:</span> <b id="top-ping" class="cyan">--</b></div>
            <div class="mem-slot"><span>Down:</span> <b id="top-dl" class="cyan">--</b></div>
            <div class="mem-slot"><span>Up:</span> <b id="top-ul" class="purple">--</b></div>
        </div>

        <div class="control-deck">
            <select id="server-selector" class="native-select">
                <option value="auto">⚡ تلقائي (أفضل استجابة)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat Fiber</option>
            </select>
        </div>

        <div class="gauge-complex">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-ring-container">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="g-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path class="track-dim" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="active-path" class="track-lit" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#g-cyan)" />
                </svg>
                <div id="needle" class="needle-spike"></div>
            </div>
            
            <div class="center-hud">
                <div id="speed-display">0.0</div>
                <div id="mode-label" class="mode-label">IDLE</div>
                <div class="unit-label">Mbps</div>
            </div>
        </div>

        <div class="live-jitter-panel">
            <div class="jitter-row">
                <span class="j-lbl">البنق المثقل (Live Jitter):</span>
                <span id="live-jitter" class="j-val">--</span>
                <span class="j-unit">ms</span>
            </div>
            <div class="jitter-graph">
                <div id="jitter-bar" class="jitter-bar" style="width: 0%"></div>
            </div>
        </div>

        <button id="start-btn" class="native-btn" onclick="startNativeTest()">بدء الفحص الكامل</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
