<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قياس السرعة V129 | Hybrid</title>
    <style>
        /* --- تصميم الكبسولة V129 --- */
        :root { --accent: #00E676; --bg: #050508; --card: #121217; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: var(--bg); color: var(--text); margin: 0; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; 
        }

        /* حاوية الفحص */
        .app-container {
            width: 100%; max-width: 420px; padding: 25px;
            background: var(--card); border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* الرأس: السيرفر */
        .header-status {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 50px;
        }
        .server-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
        .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 8px var(--accent); }
        .status-text { font-weight: bold; color: var(--accent); font-size: 0.85rem; }

        /* العداد */
        .gauge-wrapper {
            position: relative; width: 260px; height: 260px; margin: 10px auto;
        }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        /* دائرة مفتوحة 270 درجة */
        .track-bg { stroke: #222; stroke-width: 12; stroke-linecap: round; fill: none; }
        .track-fg { 
            stroke: var(--accent); stroke-width: 12; stroke-linecap: round; fill: none;
            stroke-dasharray: 565; stroke-dashoffset: 565; /* البداية صفر */
            transition: stroke-dashoffset 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.4));
        }

        .gauge-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center;
        }
        #main-speed { font-size: 4.5rem; font-weight: 800; line-height: 1; letter-spacing: -2px; }
        .unit-label { font-size: 0.9rem; color: #666; font-weight: bold; }

        /* شبكة البيانات */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .stat-label { font-size: 0.7rem; color: #777; font-weight: bold; margin-bottom: 5px; }
        .stat-val { font-size: 1.2rem; font-weight: 900; direction: ltr; }
        
        .c-ping { border-right: 2px solid #FFD700; }
        .c-jit { border-right: 2px solid #FF5722; }
        .c-dl { border-right: 2px solid #00E676; }
        .c-ul { border-right: 2px solid #D500F9; }

        /* الأزرار */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-start {
            flex: 3; padding: 18px; border: none; border-radius: 15px;
            background: white; color: black; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; transition: 0.2s; box-shadow: 0 5px 20px rgba(255,255,255,0.1);
        }
        .btn-start:hover { transform: translateY(-2px); background: var(--accent); }
        .btn-start:disabled { background: #333; color: #555; cursor: not-allowed; transform: none; }

        .btn-reset {
            flex: 1; background: #222; border: 1px solid #333; border-radius: 15px;
            color: white; font-size: 1.5rem; cursor: pointer; transition: 0.2s;
        }
        .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header-status">
            <div class="server-info">
                <div class="dot" id="status-dot"></div>
                <span id="server-name">تلقائي (KSA)</span>
            </div>
            <div class="status-text" id="phase-txt">جاهز</div>
        </div>

        <div class="gauge-wrapper">
            <svg viewBox="0 0 240 240">
                <path class="track-bg" d="M 40 200 A 100 100 0 1 1 200 200" />
                <path id="gauge-path" class="track-fg" d="M 40 200 A 100 100 0 1 1 200 200" />
            </svg>
            <div class="gauge-content">
                <div id="main-speed">0.0</div>
                <div class="unit-label">Mbps</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card c-ping">
                <span class="stat-label">PING</span>
                <span id="val-ping" class="stat-val">--</span>
            </div>
            <div class="stat-card c-jit">
                <span class="stat-label">JITTER</span>
                <span id="val-jitter" class="stat-val">--</span>
            </div>
            <div class="stat-card c-dl">
                <span class="stat-label">DOWNLOAD</span>
                <span id="val-dl" class="stat-val">--</span>
            </div>
            <div class="stat-card c-ul">
                <span class="stat-label">UPLOAD</span>
                <span id="val-ul" class="stat-val">--</span>
            </div>
        </div>

        <div class="btn-group">
            <button id="start-btn" class="btn-start" onclick="runHybridTest()">بدء الفحص</button>
            <button class="btn-reset" onclick="resetSystem()">↺</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
