<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-SPEED V66 | GOLDEN CALIBRATION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    
    <div class="master-hub">
        <div class="server-control">
            <div class="select-wrapper">
                <label>NODE SELECTOR</label>
                <select id="server-selector" class="modern-select">
                    <option value="auto">⚡ تلقائي (الأسرع)</option>
                    <option value="stc">STC - الاتصالات السعودية</option>
                    <option value="mobily">Mobily - موبايلي</option>
                    <option value="zain">Zain - زين</option>
                    <option value="salam">Salam - سلام</option>
                    <option value="go">GO - عذيب للاتصالات</option>
                    <option value="dawiyat">Dawiyat - ضوئيات</option>
                </select>
            </div>
        </div>

        <div class="gauge-world">
            <div class="gauge-ticks">
                <span class="tick" style="--angle: -120deg; --offset: 0;">0</span>
                <span class="tick" style="--angle: -72deg; --offset: 100;">100</span>
                <span class="tick" style="--angle: -24deg; --offset: 200;">200</span>
                <span class="tick" style="--angle: 24deg; --offset: 300;">300</span>
                <span class="tick" style="--angle: 72deg; --offset: 400;">400</span>
                <span class="tick" style="--angle: 120deg; --offset: 500;">500</span>
            </div>
            
            <div class="turbine-wrap">
                <svg class="main-gauge" viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                </svg>
                <div id="needle" class="digital-needle"></div>
            </div>
            
            <div class="center-display">
                <div id="main-speed">0</div>
                <div id="unit-text" class="unit-lbl">DOWNLOAD</div>
                <div class="unit-mbps">MBPS</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card">
                <span class="lbl">IDLE PING</span>
                <span id="res-ping" class="val">--</span>
                <span class="ms">ms</span>
            </div>
            <div class="res-card active-pulse">
                <span class="lbl">LOADED PING</span>
                <span id="res-load" class="val">--</span>
                <span class="ms">ms</span>
            </div>
            <div class="res-card">
                <span class="lbl">UPLOAD</span>
                <span id="res-ul" class="val">--</span>
                <span class="ms">Mbps</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startV66()">IGNITE</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
