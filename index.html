<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V78 | النسخة الاحترافية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="master-container">
        <div class="server-panel">
            <label>سيرفر الفحص (KSA Node)</label>
            <select id="server-selector" class="cyber-select">
                <option value="auto">⚡ رادار تلقائي (أفضل بنق)</option>
                <option value="stc">STC (Saudi Telecom)</option>
                <option value="mobily">Mobily (Etisalat)</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam (Integrated)</option>
                <option value="go">GO (Atheeb)</option>
                <option value="dawiyat">Dawiyat (Fiber)</option>
            </select>
        </div>

        <div class="gauge-engine">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-wrap">
                <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="88"></circle></svg>
                <div id="needle" class="needle-core"></div>
            </div>
            <div class="center-data">
                <div id="main-speed">0</div>
                <div id="status-label" class="status-label">جاهز</div>
                <div class="unit">MBPS</div>
            </div>
        </div>

        <div class="results-grid">
            <div class="res-card">
                <span class="lbl">البنق (Idle)</span>
                <span id="res-ping" class="val">--</span>
                <span class="unit-s">ms</span>
            </div>
            <div class="res-card active">
                <span class="lbl">البنق (Loaded)</span>
                <span id="res-load" class="val">--</span>
                <span class="unit-s">ms</span>
            </div>
            <div class="res-card">
                <span class="lbl">الرفع</span>
                <span id="res-ul" class="val">--</span>
                <span class="unit-s">Mbps</span>
            </div>
        </div>

        <button id="start-btn" class="ignite-btn" onclick="startEngine()">ابدأ الاختبار</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
