<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرك الفحص الفائق V15</title>
    <style>
        :root { --neon: #00f2fe; --bg: #080808; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-card { width: 90%; max-width: 800px; background: #111; padding: 40px; border-radius: 30px; border: 1px solid #222; text-align: center; }
        .hero-speed { font-size: 10rem; font-weight: 900; background: linear-gradient(180deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 10px 0; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .box { background: #181818; padding: 20px; border-radius: 20px; border: 1px solid #282828; }
        .box.active { border-color: var(--neon); box-shadow: 0 0 15px rgba(0,242,254,0.1); }
        .label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 5px; font-weight: bold; }
        .val { font-size: 2.5rem; font-weight: 900; }
        .btn { width: 100%; margin-top: 30px; background: #fff; color: #000; border: none; padding: 20px; border-radius: 50px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: var(--neon); transform: scale(1.02); }
        #status { margin-top: 15px; font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>
    <div class="main-card">
        <span style="color:var(--neon); letter-spacing: 5px; font-weight: 900;">HIGH-SPEED ANALYZER</span>
        <div id="v-dl" class="hero-speed">0</div>
        <div style="font-weight: 900; color: #333; margin-top: -15px;">Mbps Download</div>

        <div class="stats">
            <div class="box" id="c-loaded">
                <span class="label">البينق تحت الضغط (Loaded)</span>
                <span id="v-loaded" class="val">--</span><small>ms</small>
            </div>
            <div class="box" id="c-ul">
                <span class="label">سرعة الرفع (Upload)</span>
                <span id="v-ul" class="val">--</span><small>Mbps</small>
            </div>
        </div>

        <button class="btn" onclick="runV15Engine()">ابدأ فحص السرعة القصوى</button>
        <div id="status">جاهز للمعايرة (بينق STC مفعل مخفياً)</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
