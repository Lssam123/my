<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V87 | TURBO ENGINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="main-console">
        
        <div class="server-control">
            <select id="server-selector" class="pro-selector">
                <option value="auto">⚡ أفضل مسار (Auto Best)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat Fiber</option>
            </select>
        </div>

        <div class="gauge-container">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-ring">
                <svg viewBox="0 0 200 200">
                    <circle class="track-gray" cx="100" cy="100" r="90"></circle>
                    <circle id="track-active" class="track-color" cx="100" cy="100" r="90"></circle>
                </svg>
                <div id="needle" class="needle-pointer"></div>
            </div>
            
            <div class="center-data">
                <div id="speed-val">0</div>
                <div id="phase-label" class="phase-label">READY</div>
                <div id="unit-label" class="unit-label">Mbps</div>
            </div>
        </div>

        <div class="stats-deck">
            <div class="stat-box">
                <span class="lbl">البنق (Ping)</span>
                <span id="res-ping" class="val">--</span>
                <span class="unit">ms</span>
            </div>
            <div class="stat-box highlight">
                <span class="lbl">المثقل (Loaded)</span>
                <span id="res-loaded" class="val">--</span>
                <span class="unit">ms</span>
            </div>
            <div class="stat-box">
                <span class="lbl">الرفع (Upload)</span>
                <span id="res-ul" class="val">--</span>
                <span class="unit">Mbps</span>
            </div>
        </div>

        <button id="start-btn" class="turbo-btn" onclick="startTurboTest()">🚀 ابدأ الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
