<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V82 | نظام الفحص الموحد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="app-shell">
        
        <div class="top-results-bar">
            <div class="res-item"><span>البنق:</span> <b id="top-ping">--</b></div>
            <div class="res-item"><span>التحميل:</span> <b id="top-dl">--</b></div>
            <div class="res-item"><span>الرفع:</span> <b id="top-ul">--</b></div>
        </div>

        <div class="server-panel">
            <select id="server-selector" class="cyber-select">
                <option value="auto">⚡ رادار تلقائي (أسرع مسار)</option>
                <option value="stc">STC</option>
                <option value="mobily">Mobily</option>
                <option value="zain">Zain</option>
                <option value="salam">Salam</option>
                <option value="go">GO</option>
                <option value="dawiyat">Dawiyat</option>
            </select>
        </div>

        <div class="gauge-engine">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-vessel">
                <svg viewBox="0 0 200 200">
                    <circle class="track-bg" cx="100" cy="100" r="90"></circle>
                </svg>
                <div id="needle" class="needle-plasma"></div>
            </div>
            <div class="readout-core">
                <div id="main-value">0</div>
                <div id="test-status" class="status-msg">جاهز للفحص</div>
                <div id="unit-label" class="unit-label">MS PING</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card" id="card-ping">
                <span class="lbl">البنق (Ping)</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div class="res-card highlight" id="card-load">
                <span class="lbl">المثقل (Jitter)</span>
                <span id="res-load" class="val">--</span>
            </div>
            <div class="res-card" id="card-ul">
                <span class="lbl">الرفع (Upload)</span>
                <span id="res-ul" class="val">--</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startUnifiedTest()">ابدأ الفحص الشامل</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
