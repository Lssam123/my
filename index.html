<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشبكة المتقدم | مشروع تخرج</title>
    <style>
        :root { --main: #00f2fe; --bg: #060912; --card: #111827; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 700px; background: var(--card); padding: 40px; border-radius: 35px; box-shadow: 0 40px 80px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        /* عداد التحميل المركزي */
        .hero-section { margin-bottom: 40px; }
        .hero-label { font-size: 1rem; color: var(--main); font-weight: bold; letter-spacing: 1px; }
        .speed-val { font-size: 7.5rem; font-weight: 900; background: linear-gradient(180deg, #fff, var(--main)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 10px 0; }
        
        /* بطاقات النتائج المصغرة */
        .results-grid { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .mini-card { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 18px; flex: 1; border: 1px solid transparent; transition: 0.3s; }
        .mini-card.active { border-color: var(--main); background: rgba(0, 242, 254, 0.05); }
        .label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
        .value { font-size: 1.4rem; font-weight: bold; color: #fff; }
        .unit { font-size: 0.7rem; color: #64748b; margin-right: 2px; }

        /* الأزرار والحالة */
        .btn-start { background: linear-gradient(135deg, var(--main), #4facfe); color: #060912; border: none; padding: 18px 60px; border-radius: 50px; font-size: 1.3rem; font-weight: 800; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2); }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0, 242, 254, 0.4); }
        .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: scale(0.95); }
        #status { margin-top: 20px; font-size: 0.85rem; color: var(--main); height: 20px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <span class="hero-label">سرعة التحميل</span>
            <div id="dl-speed" class="speed-val">0</div>
            <span style="color: #64748b; font-size: 0.9rem;">ميجابت في الثانية</span>
        </div>

        <div class="results-grid">
            <div class="mini-card" id="card-ping">
                <span class="label">استجابة خاملة</span>
                <span id="val-ping" class="value">--</span><span class="unit">ملي ثانية</span>
            </div>
            <div class="mini-card" id="card-loaded">
                <span class="label">استجابة مُثقلة</span>
                <span id="val-loaded" class="value">--</span><span class="unit">ملي ثانية</span>
            </div>
            <div class="mini-card" id="card-ul">
                <span class="label">سرعة الرفع</span>
                <span id="val-upload" class="value">--</span><span class="unit">ميجابت</span>
            </div>
        </div>

        <button id="run-btn" class="btn-start" onclick="startSystem()">بدء الفحص</button>
        <div id="status">جاهز للفحص</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
