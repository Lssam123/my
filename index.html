<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قياس السرعة V132 | النواة المستقلة</title>
    <style>
        /* --- تصميم V132 الاحترافي --- */
        :root {
            --primary: #00ffcc;    /* تركواز للتحميل */
            --secondary: #bd00ff;  /* بنفسجي للرفع */
            --bg: #0b0c10;
            --panel: #1f2833;
            --text-main: #66fcf1;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        /* الخلفية الرقمية */
        .digital-bg {
            position: fixed; width: 100%; height: 100%;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 30px 30px; opacity: 0.3; z-index: -1;
        }

        .main-card {
            width: 95%; max-width: 460px; padding: 30px;
            background: rgba(31, 40, 51, 0.95); border: 1px solid #45a29e;
            border-radius: 20px; box-shadow: 0 0 80px rgba(69, 162, 158, 0.2);
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }

        /* رأس الصفحة */
        .header-info {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 50px;
            font-size: 0.8rem; color: #c5c6c7;
        }
        .server-txt { color: var(--text-main); font-weight: bold; }

        /* العداد */
        .gauge-section { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-bg { stroke: #0b0c10; stroke-width: 14; stroke-linecap: round; fill: none; }
        .track-fg {
            stroke: var(--primary); stroke-width: 14; stroke-linecap: round; fill: none;
            stroke-dasharray: 615; stroke-dashoffset: 615; /* البداية صفر */
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .center-hud {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center;
        }
        #speed-val { font-size: 4.5rem; font-weight: 900; line-height: 0.9; letter-spacing: -3px; color: white; }
        .unit-txt { font-size: 0.8rem; color: #888; margin-top: 5px; }
        #phase-txt { font-size: 1rem; font-weight: bold; color: var(--primary); margin-top: 5px; }

        /* منطقة البنق المثقل */
        .jitter-zone {
            margin-top: -30px; background: rgba(0,0,0,0.5); padding: 8px 15px; 
            border-radius: 10px; display: inline-block; align-self: center;
            border: 1px solid #333; z-index: 10;
        }
        .j-lbl { font-size: 0.8rem; color: #aaa; }
        .j-val { font-size: 1.1rem; font-weight: bold; color: #ffd700; margin-right: 5px; }

        /* شريط الوقت */
        .time-bar-bg { width: 100%; height: 6px; background: #0b0c10; border-radius: 3px; overflow: hidden; }
        .time-bar-fg { height: 100%; width: 0%; background: var(--text-main); transition: width 0.1s linear; }

        /* النتائج */
        .grid-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .s-lbl { font-size: 0.65rem; color: #888; font-weight: bold; margin-bottom: 5px; }
        .s-val { font-size: 1rem; font-weight: 900; direction: ltr; }

        /* الأزرار */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-start {
            flex: 3; padding: 16px; border: none; border-radius: 10px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s;
        }
        .btn-start:hover { background: var(--text-main); box-shadow: 0 0 25px var(--text-main); }
        .btn-start:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .btn-reset {
            flex: 1; background: transparent; border: 1px solid #45a29e; color: #45a29e;
            border-radius: 10px; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .btn-reset:hover { background: #45a29e; color: black; }

    </style>
</head>
<body>
    <div class="digital-bg"></div>
    <div class="main-card">
        
        <div class="header-info">
            <span id="server-status">جاري البحث...</span>
            <span id="timer-display">00s</span>
        </div>

        <div class="time-bar-bg"><div id="progress-fill" class="time-bar-fg"></div></div>

        <div class="gauge-section">
            <svg viewBox="0 0 260 260">
                <defs>
                    <linearGradient id="g-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffcc"/><stop offset="1" stop-color="#0099ff"/></linearGradient>
                    <linearGradient id="g-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#bd00ff"/><stop offset="1" stop-color="#ff0055"/></linearGradient>
                </defs>
                <path class="track-bg" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="track-active" class="track-fg" d="M 50 210 A 110 110 0 1 1 210 210" stroke="url(#g-dl)" />
            </svg>
            <div class="center-hud">
                <div id="speed-val">0.0</div>
                <div class="unit-txt">ميجابت/ثانية</div>
                <div id="phase-txt">جاهز</div>
            </div>
        </div>

        <div class="jitter-zone">
            <span class="j-lbl">البنق تحت الضغط:</span>
            <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="grid-stats">
            <div class="stat-item">
                <span class="s-lbl">PING</span>
                <span id="res-ping" class="s-val">--</span>
            </div>
            <div class="stat-item">
                <span class="s-lbl">JITTER</span>
                <span id="res-jitter" class="s-val" style="color:#ffd700">--</span>
            </div>
            <div class="stat-item">
                <span class="s-lbl">DOWN</span>
                <span id="res-dl" class="s-val" style="color:var(--primary)">--</span>
            </div>
            <div class="stat-item">
                <span class="s-lbl">UP</span>
                <span id="res-ul" class="s-val" style="color:var(--secondary)">--</span>
            </div>
        </div>

        <div class="btn-group">
            <button id="start-btn" class="btn-start" onclick="startSystem()">بدء الفحص</button>
            <button class="btn-reset" onclick="resetSystem()">↺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
