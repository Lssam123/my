<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Pro V56 | Precision UI</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #020308;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .master-panel {
            width: 850px; background: var(--glass); backdrop-filter: blur(50px);
            border-radius: 60px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        /* شريط النتائج العلوي الجديد */
        .top-results {
            display: flex; justify-content: space-around;
            background: rgba(255,255,255,0.03); padding: 15px;
            border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .res-item { text-align: center; }
        .res-item span { display: block; }
        .res-item .val { font-size: 1.4rem; font-weight: 900; color: var(--neon); }
        .res-item .lbl { font-size: 0.6rem; color: #555; font-weight: 900; }

        .server-select {
            background: #111; color: var(--neon); border: 1px solid #333;
            padding: 10px 25px; border-radius: 100px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        /* العداد (لم يتم لمسه) */
        .gauge-module {
            position: relative; width: 480px; height: 350px;
            margin: 0 auto; display: flex; justify-content: center; align-items: center;
        }
        .gauge-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .needle {
            position: absolute; bottom: 60px; left: 50%; width: 4px; height: 150px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon)); z-index: 5;
        }
        .speed-readout {
            position: absolute; top: 55%; left: 50%;
            transform: translate(-50%, -50%); z-index: 10; text-align: center;
        }
        #speed-num { font-size: 6.5rem; font-weight: 950; font-family: 'Arial Black'; line-height: 1; color: #fff; }
        .unit-label { color: #444; font-weight: 900; letter-spacing: 5px; font-size: 0.8rem; }

        .btn-start {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: #fff; color: #000; font-weight: 950; cursor: pointer;
            margin-top: 20px; transition: 0.4s;
        }
        .btn-start:hover { transform: scale(1.1); background: var(--neon); }
    </style>
</head>
<body>

<div class="master-panel">
    <div class="top-results">
        <div class="res-item"><span id="top-ping" class="val">--</span><span class="lbl">PING (ms)</span></div>
        <div class="res-item"><span id="top-load" class="val">--</span><span class="lbl">LOADED (ms)</span></div>
        <div class="res-item"><span id="top-dl" class="val">--</span><span class="lbl">DOWNLOAD (Mb)</span></div>
        <div class="res-item"><span id="top-ul" class="val">--</span><span class="lbl">UPLOAD (Mb)</span></div>
    </div>

    <select id="isp-node" class="server-select" onchange="manualChange()">
        <option value="cf">Cloudflare (تلقائي)</option>
        <option value="stc">STC - الاتصالات السعودية</option>
        <option value="mobily">Mobily - موبايلي</option>
        <option value="zain">Zain - زين السعودية</option>
        <option value="salam">Salam - سلام</option>
        <option value="go">GO - عذيب</option>
    </select>

    <div class="gauge-module">
        <svg class="gauge-svg" viewBox="0 0 400 300">
            <path d="M 50 240 A 150 150 0 0 1 350 240" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="14" font-weight="950" text-anchor="middle">
                <text x="50" y="270">0</text><text x="200" y="90">300</text><text x="350" y="270">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="speed-readout">
            <span id="speed-num">0</span>
            <span class="unit-label" id="mode-label">MBPS DOWNLOAD</span>
        </div>
    </div>

    <button id="main-btn" class="btn-start" onclick="runV56()">بدء</button>
</div>

<script src="script.js"></script>
</body>
</html>
