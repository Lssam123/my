<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Elite V48 | Dedicated Gauge</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #010206;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 800px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 50px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
        }

        /* اختيار السيرفر */
        .select-wrapper { margin-bottom: 25px; }
        .isp-select {
            background: #111; color: var(--neon); border: 1px solid #333;
            padding: 10px 20px; border-radius: 50px; cursor: pointer;
        }

        /* العداد للداونلود فقط */
        .gauge-wrap {
            position: relative;
            width: 450px;
            height: 300px;
            margin: 0 auto;
        }

        .needle {
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 4px;
            height: 140px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon));
        }

        #speed-num {
            font-size: 6rem;
            font-weight: 900;
            display: block;
            margin-top: 180px;
            font-family: 'Arial Black', sans-serif;
        }

        .unit { color: #555; font-weight: 900; letter-spacing: 4px; font-size: 0.8rem; }

        /* البطاقات */
        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px;
        }

        .card {
            background: rgba(255,255,255,0.01); padding: 20px; border-radius: 25px; border: 1px solid var(--border);
        }

        .card.active { border-color: var(--neon); }
        .card .v { font-size: 1.8rem; font-weight: 900; display: block; }
        .card .l { font-size: 0.6rem; color: #444; font-weight: 900; }

        .btn-run {
            width: 80px; height: 80px; border-radius: 50%; background: #fff;
            border: none; font-weight: 900; cursor: pointer; margin-top: 20px;
            transition: 0.3s;
        }

        .btn-run:hover { transform: scale(1.1); background: var(--neon); }
    </style>
</head>
<body>

<div class="container">
    <div class="select-wrapper">
        <select id="isp-node" class="isp-select">
            <option value="auto">تحديد تلقائي للأسرع</option>
            <option value="stc">STC - الاتصالات السعودية</option>
            <option value="mobily">Mobily - موبايلي</option>
            <option value="zain">Zain - زين</option>
            <option value="salam">Salam - سلام</option>
            <option value="go">GO - عذيب</option>
            <option value="dawiyat">Dawiyat - ضوئيات</option>
        </select>
    </div>

    <div class="gauge-wrap">
        <svg viewBox="0 0 400 210" style="width:100%;">
            <path d="M 50 190 A 150 150 0 0 1 350 190" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#222" font-size="12" font-weight="900" text-anchor="middle">
                <text x="50" y="208">0</text>
                <text x="125" y="70">200</text>
                <text x="275" y="70">400</text>
                <text x="350" y="208">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <span id="speed-num">0</span>
        <span class="unit">DOWNLOAD MBPS</span>
    </div>

    <button id="action-btn" class="btn-run" onclick="startFresh()">بدء</button>

    <div class="stats">
        <div class="card" id="p-card"><span class="l">PING (ms)</span><span id="v-ping" class="v">--</span></div>
        <div class="card" id="j-card"><span class="l">JITTER (ms)</span><span id="v-jitter" class="v">--</span></div>
        <div class="card" id="u-card"><span class="l">UPLOAD (Mbps)</span><span id="v-upload" class="v">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
