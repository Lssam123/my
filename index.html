<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V73 | FINAL PRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="container">
        <div class="server-box">
            <label>سيرفر الفحص (Node Selection)</label>
            <select id="server-selector" class="modern-select">
                <option value="auto">⚡ رادار تلقائي (الأسرع)</option>
                <option value="stc">STC (Saudi Telecom)</option>
                <option value="mobily">Mobily (Etisalat)</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam (Integrated)</option>
                <option value="go">GO (Atheeb)</option>
                <option value="dawiyat">Dawiyat (Fiber)</option>
            </select>
        </div>

        <div class="gauge-section">
            <div class="gauge-ticks" id="ticks"></div>
            <div class="gauge-wrap">
                <svg viewBox="0 0 200 200"><circle class="bg-track" cx="100" cy="100" r="85"></circle></svg>
                <div id="needle" class="needle"></div>
            </div>
            <div class="display-center">
                <div id="main-speed">0</div>
                <div id="status-text" class="status">جاهز</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="results-grid">
            <div class="card"><span class="label">البنق الخامل</span><span id="res-ping" class="value">--</span><span class="ms">ms</span></div>
            <div class="card active"><span class="label">البنق المثقل</span><span id="res-load" class="value">--</span><span class="ms">ms</span></div>
            <div class="card"><span class="label">سرعة الرفع</span><span id="res-ul" class="value">--</span><span class="ms">Mbps</span></div>
        </div>
        <button id="start-btn" onclick="startTest()">ابدأ فحص السرعة</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
