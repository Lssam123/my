<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V39 | GO Support</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #030008;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-panel {
            width: 90%;
            max-width: 850px;
            background: var(--glass);
            backdrop-filter: blur(50px);
            border-radius: 60px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        /* اختيار السيرفر */
        .server-section {
            margin-bottom: 20px;
        }

        .server-select {
            background: #111;
            color: var(--neon);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 100px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* منطقة العداد */
        .gauge-container {
            position: relative;
            width: 420px;
            height: 380px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* قوس العداد */
        .gauge-svg {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .needle {
            position: absolute;
            bottom: 120px; /* تم تعديل الوضع ليتناسب مع التصميم الدائري */
            width: 4px;
            height: 140px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: rotate(-100deg);
            transition: transform 0.5s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 8px var(--neon));
            z-index: 5;
        }

        .speed-info {
            z-index: 10;
            margin-top: -40px;
        }

        .speed-value {
            font-size: 7.5rem;
            font-weight: 900;
            line-height: 0.8;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(to bottom, #fff, var(--neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speed-unit {
            font-size: 1.1rem;
            color: #444;
            letter-spacing: 6px;
            font-weight: 900;
            margin-top: 10px;
        }

        /* زر البدء الدائري تحت العداد */
        .btn-start-wrap {
            margin-top: 20px;
            z-index: 20;
        }

        .btn-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .btn-circle:hover {
            background: var(--neon);
            transform: scale(1.1);
            box-shadow: 0 0 40px var(--neon);
        }

        .btn-circle:disabled {
            opacity: 0.1;
            cursor: wait;
        }

        /* الإحصائيات السفلية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-box {
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .stat-box .lbl { font-size: 0.7rem; color: #555; display: block; margin-bottom: 5px; font-weight: 900; }
        .stat-box .val { font-size: 1.8rem; font-weight: 900; color: #fff; }

    </style>
</head>
<body>

<div class="main-panel">
    <div class="server-section">
        <select id="server-select" class="server-select" onchange="manualNode()">
            <option value="auto">⚡ تحديد تلقائي ذكي</option>
            <option value="stc">STC - الاتصالات السعودية</option>
            <option value="mobily">Mobily - موبايلي</option>
            <option value="zain">Zain - زين</option>
            <option value="salam">Salam - سلام</option>
            <option value="go">GO - عذيب للاتصالات</option>
        </select>
    </div>

    <div class="gauge-container">
        <svg class="gauge-svg" viewBox="0 0 400 300">
            <path d="M 100 250 A 120 120 0 1 1 300 250" fill="none" stroke="#15151b" stroke-width="12" stroke-linecap="round"/>
            
            <text x="80" y="260" fill="#444" font-size="12" font-weight="900">0</text>
            <text x="65" y="160" fill="#444" font-size="12" font-weight="900">100</text>
            <text x="120" y="80" fill="#444" font-size="12" font-weight="900">250</text>
            <text x="190" y="60" fill="#444" font-size="12" font-weight="900">500</text>
            <text x="270" y="80" fill="#444" font-size="12" font-weight="900">750</text>
            <text x="325" y="160" fill="#444" font-size="12" font-weight="900">900</text>
            <text x="310" y="260" fill="#444" font-size="12" font-weight="900">1000+</text>
        </svg>

        <div id="needle" class="needle"></div>

        <div class="speed-info">
            <div id="main-speed" class="speed-value">0</div>
            <div class="speed-unit">MBPS</div>
        </div>
    </div>

    <div class="btn-start-wrap">
        <button id="start-btn" class="btn-circle" onclick="runV39()">بدء</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <span class="lbl">البنق (ms)</span>
            <span id="v-ping" class="val">--</span>
        </div>
        <div class="stat-box">
            <span class="lbl">المثقل (ms)</span>
            <span id="v-loaded" class="val">--</span>
        </div>
        <div class="stat-box">
            <span class="lbl">الرفع (Mbps)</span>
            <span id="v-ul" class="val">--</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
