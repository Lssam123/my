<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V86 | QUANTUM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="quantum-shell">
        
        <div class="server-deck">
            <select id="server-selector" class="quantum-select">
                <option value="auto">⚡ أفضل مسار (Auto Best)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat Fiber</option>
            </select>
        </div>

        <div class="gauge-reactor">
            <div class="gauge-scale" id="gauge-scale"></div>
            
            <div class="gauge-ring-box">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="dl-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="ul-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="progress-path" class="track-active" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#dl-grad)" />
                </svg>
                <div id="needle" class="quantum-needle"></div>
            </div>

            <div class="reactor-core">
                <div id="main-val">0.0</div>
                <div id="phase-lbl" class="phase-lbl">READY</div>
                <div class="unit-lbl">Mbps</div>
            </div>
        </div>

        <div class="data-grid">
            <div class="data-cell">
                <span class="l">Ping</span>
                <span id="res-ping" class="v">--</span>
            </div>
            <div class="data-cell">
                <span class="l">Download</span>
                <span id="res-dl" class="v dl-color">--</span>
            </div>
            <div class="data-cell">
                <span class="l">Upload</span>
                <span id="res-ul" class="v ul-color">--</span>
            </div>
        </div>

        <button id="start-btn" class="quantum-btn" onclick="startQuantumTest()">بدء الفحص الدقيق</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
