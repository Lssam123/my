<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V38 | Precision Edition</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #0b0c10;
            --glass: rgba(31, 40, 51, 0.4);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 95%;
            max-width: 950px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        /* التحكم العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            background: rgba(0,0,0,0.2);
            padding: 15px 30px;
            border-radius: 20px;
        }

        .server-group select {
            background: #1f2833;
            color: var(--neon);
            border: 1px solid #45a29e;
            padding: 8px 20px;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-launch {
            background: var(--neon);
            color: #0b0c10;
            border: none;
            padding: 12px 45px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .btn-launch:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--neon); }

        /* منطقة العداد والإبرة */
        .gauge-section {
            position: relative;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gauge-container {
            position: relative;
            width: 400px;
            height: 250px;
        }

        /* أرقام التدريج حول العداد */
        .tick {
            position: absolute;
            font-size: 0.8rem;
            color: #444;
            font-weight: 900;
            transform-origin: center;
        }

        /* الإبرة */
        .needle {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 4px;
            height: 160px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-100deg); /* بداية من الصفر */
            transition: transform 0.5s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 8px var(--neon));
            z-index: 5;
        }
        .needle-pivot {
            position: absolute;
            bottom: 12px;
            left: 50%;
            width: 16px;
            height: 16px;
            background: var(--neon);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px var(--neon);
            z-index: 6;
        }

        .speed-readout {
            margin-top: -20px;
            text-align: center;
        }
        .speed-num { font-size: 8rem; font-weight: 900; color: #fff; line-height: 0.8; }
        .speed-label { font-size: 1.2rem; color: #45a29e; letter-spacing: 5px; font-weight: bold; }

        /* البطاقات السفلية */
        .stats-footer {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 50px;
        }

        .card {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
            transition: 0.3s;
        }
        .card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }
        .card .title { font-size: 0.7rem; color: #555; display: block; margin-bottom: 10px; font-weight: bold; }
        .card .value { font-size: 2.2rem; font-weight: 900; color: var(--neon); }

    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="top-nav">
        <div class="server-group">
            <select id="server-select" onchange="manualNode()">
                <option value="auto">⚡ ذكاء اصطناعي (الأسرع)</option>
                <option value="stc">STC - الرياض</option>
                <option value="mobily">Mobily - جدة</option>
                <option value="zain">Zain - السعودية</option>
                <option value="salam">Salam - المتكاملة</option>
            </select>
        </div>
        <button class="btn-launch" onclick="startV38()">إطلاق الفحص</button>
    </div>

    <div class="gauge-section">
        <div class="gauge-container">
            <svg viewBox="0 0 400 200" style="width:100%; height:100%;">
                <path d="M 50 180 A 150 150 0 0 1 350 180" fill="none" stroke="#15151b" stroke-width="12" stroke-linecap="round"/>
                <text x="45" y="195" fill="#444" font-size="12" font-weight="900">0</text>
                <text x="35" y="110" fill="#444" font-size="12" font-weight="900">100</text>
                <text x="100" y="55" fill="#444" font-size="12" font-weight="900">250</text>
                <text x="185" y="35" fill="#444" font-size="12" font-weight="900">500</text>
                <text x="280" y="55" fill="#444" font-size="12" font-weight="900">750</text>
                <text x="340" y="110" fill="#444" font-size="12" font-weight="900">900</text>
                <text x="330" y="195" fill="#444" font-size="12" font-weight="900">1000+</text>
            </svg>
            <div id="needle" class="needle"></div>
            <div class="needle-pivot"></div>
        </div>

        <div class="speed-readout">
            <div id="main-val" class="speed-num">0</div>
            <div class="speed-label">MBPS</div>
        </div>
    </div>

    <div class="stats-footer">
        <div class="card" id="card-ping">
            <span class="title">بنق نقي (Idle)</span>
            <span id="v-ping" class="value">--</span><small>ms</small>
        </div>
        <div class="card" id="card-loaded">
            <span class="title">بنق مثقل (Loaded)</span>
            <span id="v-loaded" class="val-loaded value">--</span><small>ms</small>
        </div>
        <div class="card" id="card-ul">
            <span class="title">سرعة الرفع</span>
            <span id="v-ul" class="value">--</span><small>Mbps</small>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
