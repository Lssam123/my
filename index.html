<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V112 | TACTICAL SPLIT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tactical-bg"></div>
    <div class="main-hud">
        
        <div class="cards-zone">
            <div class="t-card">
                <span class="c-title">PING</span>
                <span id="res-ping" class="c-val">-- <small>ms</small></span>
            </div>
            
            <div class="t-card upload-active">
                <span class="c-title">UPLOAD SPEED</span>
                <span id="res-ul" class="c-val purple">-- <small>Mbps</small></span>
                <div class="ul-bar-bg"><div id="ul-bar-fill" class="ul-bar-fill"></div></div>
            </div>

            <div class="t-card">
                <span class="c-title">JITTER (LOADED)</span>
                <span id="res-jitter" class="c-val yellow">-- <small>ms</small></span>
            </div>
        </div>

        <div class="gauge-sector">
            <div class="gauge-header">DOWNLOAD ENGINE</div>
            <div class="gauge-assembly">
                <div class="ticks-ring" id="ticks"></div>
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="grad-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F260"/><stop offset="1" stop-color="#0575E6"/></linearGradient>
                    </defs>
                    <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="track-dl" class="track-fg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#grad-dl)" />
                </svg>
                <div id="needle" class="needle-tac"></div>
                
                <div class="center-readout">
                    <div id="val-dl">0.0</div>
                    <div class="unit">Mbps</div>
                </div>
            </div>
            <div id="phase-lbl" class="phase-lbl">READY</div>
        </div>

        <div class="control-row">
            <select id="srv-select" class="tac-select">
                <option value="auto">📡 تلقائي (AUTO)</option>
                <option value="stc">STC</option>
                <option value="mobily">Mobily</option>
                <option value="zain">Zain</option>
            </select>
            <button id="start-btn" class="tac-btn" onclick="startV112()">START TEST</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
