<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED ELITE V76 | مشروع التخرج</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="main-hub">
        
        <div class="glass-header">
            <div class="selector-container">
                <label>رادار المواقع (KSA Nodes Radar)</label>
                <select id="server-selector" class="cyber-select">
                    <option value="auto">⚡ الاختيار الذكي (Smart Selection)</option>
                    <option value="stc">STC (Saudi Telecom)</option>
                    <option value="mobily">Mobily (Etisalat)</option>
                    <option value="zain">Zain KSA</option>
                    <option value="salam">Salam (Integrated)</option>
                    <option value="go">GO (Atheeb)</option>
                    <option value="dawiyat">Dawiyat (Fiber)</option>
                </select>
            </div>
        </div>

        <div class="engine-room">
            <div id="gauge-marks" class="gauge-marks"></div>
            <div class="gauge-body">
                <svg viewBox="0 0 200 200">
                    <circle class="track-outline" cx="100" cy="100" r="90"></circle>
                    <circle class="track-fill" cx="100" cy="100" r="90"></circle>
                </svg>
                <div id="needle" class="needle-plasma"></div>
            </div>
            <div class="data-core">
                <div id="speed-display">0</div>
                <div id="status-display" class="status-glow">جاهز للنظام</div>
                <div class="unit-tag">MBPS</div>
            </div>
        </div>

        <div class="diagnostic-grid">
            <div class="diag-card" id="ping-slot">
                <span class="d-label">البنق الخامل</span>
                <span id="ping-val" class="d-value">--</span>
                <span class="d-unit">ms</span>
            </div>
            <div class="diag-card pulse" id="load-slot">
                <span class="d-label">البنق المثقل</span>
                <span id="load-val" class="d-value">--</span>
                <span class="d-unit">ms</span>
            </div>
            <div class="diag-card" id="up-slot">
                <span class="d-label">سرعة الرفع</span>
                <span id="up-val" class="d-value">--</span>
                <span class="d-unit">Mbps</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="igniteEngine()">إطلاق محرك الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
