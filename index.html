<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V123 | FINAL FULL</title>
    <style>
        /* --- تصميم V123 المتكامل --- */
        :root { --cyan: #00F260; --pink: #ff0055; --bg: #050505; --panel: #101010; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        .hex-bg { 
            position: fixed; width: 100%; height: 100%; 
            background-image: radial-gradient(#1a1a1a 15%, transparent 16%);
            background-size: 40px 40px; opacity: 0.5; z-index: -1;
        }

        .engine-shell { 
            width: 95%; max-width: 480px; padding: 25px; 
            background: var(--panel); border: 1px solid #333; 
            border-radius: 20px; box-shadow: 0 0 60px rgba(0,0,0,0.9); 
            text-align: center; position: relative;
        }

        /* شبكة النتائج (4 خانات الآن) */
        .hex-stats { 
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px;
            margin-bottom: 25px; background: rgba(255,255,255,0.03); 
            padding: 10px; border-radius: 12px; 
        }
        .stat-hex { display: flex; flex-direction: column; border-left: 1px solid #333; }
        .stat-hex:last-child { border-left: none; }
        
        .lbl { font-size: 0.6rem; color: #888; font-weight: bold; margin-bottom: 5px; }
        .val { font-size: 0.9rem; font-weight: 900; }
        .cyan { color: var(--cyan); } .pink { color: var(--pink); } .yellow { color: #f1c40f; }

        .server-bar { margin-bottom: 20px; }
        .hex-select { width: 100%; background: #000; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; font-weight: bold; outline: none; }
        optgroup { color: var(--cyan); background: #111; }

        /* العداد */
        .gauge-hex { position: relative; width: 260px; height: 260px; margin: 0 auto; }
        .track-bg { stroke: #222; stroke-width: 14; stroke-linecap: round; }
        .track-fg { 
            stroke-width: 14; stroke-linecap: round; 
            stroke-dasharray: 600; stroke-dashoffset: 600; 
            transition: stroke-dashoffset 0.1s linear; 
            filter: drop-shadow(0 0 10px var(--cyan)); 
        }

        .center-data { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        #live-num { font-size: 4.5rem; font-weight: 900; line-height: 0.9; letter-spacing: -2px; }
        .status-msg { font-size: 0.9rem; font-weight: bold; color: var(--cyan); margin-top: 5px; }
        .unit { font-size: 0.7rem; color: #666; }

        /* أزرار التحكم */
        .control-row { display: flex; gap: 10px; margin-top: 25px; }
        
        .start-btn { 
            flex: 4; padding: 15px; 
            background: white; border: none; border-radius: 10px;
            color: black; font-weight: 900; font-size: 1.1rem; cursor: pointer; 
            transition: 0.3s; 
        }
        .start-btn:hover { background: var(--cyan); box-shadow: 0 0 30px var(--cyan); }
        .start-btn:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }

        .reset-btn {
            flex: 1; background: #222; border: 1px solid #444; border-radius: 10px;
            color: white; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .reset-btn:hover { background: #333; color: var(--pink); border-color: var(--pink); }
    </style>
</head>
<body>
    <div class="hex-bg"></div>
    <div class="engine-shell">
        
        <div class="hex-stats">
            <div class="stat-hex">
                <span class="lbl">PING</span>
                <span id="end-ping" class="val">--</span>
            </div>
            <div class="stat-hex">
                <span class="lbl">JITTER</span>
                <span id="end-jitter" class="val yellow">--</span>
            </div>
            <div class="stat-hex">
                <span class="lbl">DOWN</span>
                <span id="end-dl" class="val cyan">--</span>
            </div>
            <div class="stat-hex">
                <span class="lbl">UP</span>
                <span id="end-ul" class="val pink">--</span>
            </div>
        </div>

        <div class="server-bar">
            <select id="srv-select" class="hex-select">
                <option value="auto">⚡ تلقائي (الأفضل)</option>
                <optgroup label="شبكات السعودية (KSA)">
                    <option value="stc">STC (الاتصالات السعودية)</option>
                    <option value="mobily">Mobily (موبايلي)</option>
                    <option value="zain">Zain (زين)</option>
                    <option value="salam">Salam (سلام)</option>
                    <option value="go">GO Telecom (جو)</option>
                    <option value="dawiyat">Dawiyat (ضوئيات)</option>
                </optgroup>
            </select>
        </div>

        <div class="gauge-hex">
            <svg viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="grad-active" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#00F260"/>
                        <stop offset="100%" stop-color="#0575E6"/>
                    </linearGradient>
                </defs>
                <path class="track-bg" d="M 50 250 A 140 140 0 1 1 250 250" fill="none" />
                <path id="track-fill" class="track-fg" d="M 50 250 A 140 140 0 1 1 250 250" fill="none" stroke="url(#grad-active)" />
            </svg>
            
            <div class="center-data">
                <div id="live-num">0.0</div>
                <div id="status-msg" class="status-msg">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="control-row">
            <button id="start-btn" class="start-btn" onclick="startFullTest()">START CHECK</button>
            <button id="reset-btn" class="reset-btn" onclick="resetSystem()" title="إعادة تعيين النظام">↻</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
