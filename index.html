<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V36 | Pro Dashboard</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #030008;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية اللوحة الرئيسية */
        .glass-panel {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 60px;
            border: 1px solid var(--border);
            padding: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            text-align: center;
        }

        /* قسم التحكم بالسيرفر */
        .server-control {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .server-label { font-size: 0.75rem; color: #555; font-weight: 800; letter-spacing: 1px; }

        .server-select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--neon);
            border: 1px solid var(--border);
            padding: 10px 25px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .server-select:hover { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }

        /* منطقة العداد */
        .gauge-area {
            position: relative;
            width: 450px;
            height: 300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .gauge-arc {
            position: absolute;
            top: 0;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 8px solid rgba(255, 255, 255, 0.02);
            border-bottom-color: transparent;
            transform: rotate(-45deg);
        }

        .needle {
            position: absolute;
            bottom: 40px;
            width: 3px;
            height: 160px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            filter: drop-shadow(0 0 12px var(--neon));
            z-index: 5;
        }

        .speed-readout {
            z-index: 10;
            margin-bottom: 30px;
        }

        .speed-num {
            font-size: 8rem;
            font-weight: 900;
            line-height: 0.8;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(180deg, #fff 40%, var(--neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speed-unit { font-size: 1rem; color: #444; font-weight: 900; letter-spacing: 8px; margin-top: 15px; }

        /* بطاقات الإحصائيات السفلية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 25px 15px;
            border-radius: 35px;
            border: 1px solid var(--border);
            transition: 0.4s;
        }

        .stat-card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }

        .stat-card .val { font-size: 2.2rem; font-weight: 900; color: #fff; display: block; }
        .stat-card .lbl { font-size: 0.65rem; color: #555; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }

        /* زر البدء */
        .btn-start {
            width: 100%;
            margin-top: 45px;
            background: #fff;
            color: #000;
            border: none;
            padding: 24px;
            border-radius: 100px;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            letter-spacing: 2px;
        }

        .btn-start:hover {
            background: var(--neon);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4);
            transform: scale(1.01);
        }

        .btn-start:disabled { opacity: 0.1; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <div class="server-control">
            <span class="server-label">سيرفر الفحص:</span>
            <select id="server-select" class="server-select" onchange="manualNode()">
                <option value="auto">⚡ تحديد تلقائي ذكي</option>
                <option value="stc">STC - الاتصالات السعودية</option>
                <option value="mobily">Mobily - موبايلي</option>
                <option value="zain">Zain - زين السعودية</option>
                <option value="salam">Salam - سلام</option>
                <option value="go">GO - عذيب</option>
            </select>
        </div>

        <div class="gauge-area">
            <div class="gauge-arc"></div>
            <div id="needle" class="needle"></div>
            <div class="speed-readout">
                <div id="dl-val" class="speed-num">0</div>
                <div class="speed-unit">MBPS</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="card-ping">
                <span class="lbl">البنق (الخامل)</span>
                <span id="v-ping" class="val">--</span>
            </div>
            <div class="stat-card" id="card-loaded">
                <span class="lbl">البنق (المثقل)</span>
                <span id="v-loaded" class="val">--</span>
            </div>
            <div class="stat-card" id="card-ul">
                <span class="lbl">سرعة الرفع</span>
                <span id="v-ul" class="val">--</span>
            </div>
        </div>

        <button class="btn-start" onclick="runV36()">بدء الفحص الاحترافي</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
