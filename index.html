<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V101 | GLOBAL STANDARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="network-grid"></div>
    <div class="dashboard">
        
        <div class="top-deck">
            <div class="server-control">
                <div class="icon-pulse"></div>
                <select id="server-select" class="global-select">
                    <option value="auto">📍 تلقائي (أفضل نقطة وصول)</option>
                    <option value="stc">STC (Saudi Telecom)</option>
                    <option value="mobily">Mobily (Etisalat)</option>
                    <option value="zain">Zain KSA</option>
                    <option value="salam">Salam Integrated</option>
                    <option value="go">GO Telecom</option>
                    <option value="dawiyat">Dawiyat Fiber</option>
                </select>
            </div>
            
            <div class="score-board">
                <div class="score-item">
                    <span class="lbl">PING</span>
                    <span id="res-ping" class="val">-- <small>ms</small></span>
                </div>
                <div class="score-item">
                    <span class="lbl">DOWN</span>
                    <span id="res-dl" class="val dl-c">-- <small>Mbps</small></span>
                </div>
                <div class="score-item">
                    <span class="lbl">UP</span>
                    <span id="res-ul" class="val ul-c">-- <small>Mbps</small></span>
                </div>
            </div>
        </div>

        <div class="gauge-complex">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-outer-ring"></div>
            <div class="gauge-inner">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="grad-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9FF"/><stop offset="1" stop-color="#92FE9D"/></linearGradient>
                        <linearGradient id="grad-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7F00FF"/><stop offset="1" stop-color="#E100FF"/></linearGradient>
                    </defs>
                    <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="track-active" class="track-fg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#grad-dl)" />
                </svg>
                <div id="needle" class="needle-blade"></div>
            </div>
            
            <div class="hud-display">
                <div id="big-val">0.0</div>
                <div id="phase-status" class="status-pill">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="live-metrics">
            <div class="metric-card">
                <div class="m-head">
                    <span>البنق المثقل (Jitter)</span>
                    <strong id="live-jitter" class="yellow">--</strong>
                </div>
                <div class="graph-line"><div id="jitter-bar" style="width:0%"></div></div>
            </div>
            <div class="metric-card">
                <div class="m-head">
                    <span>ثبات الاتصال (Stability)</span>
                    <strong id="live-stability" class="green">--%</strong>
                </div>
            </div>
        </div>

        <button id="start-btn" class="start-btn" onclick="initiateGlobalTest()">START SPEEDTEST</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
