<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V142 | SIMULATION</title>
    <style>
        /* --- تصميم المحاكاة V142 --- */
        :root { 
            --dl-color: #00ffcc; 
            --ul-color: #aa00ff; 
            --ping-color: #ffcc00; 
            --bg: #0b0c10; 
            --card: #1f2833; 
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .sim-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 10%, #1a1a2e 0%, #000 100%); z-index: -1; }

        .console { 
            width: 95%; max-width: 480px; padding: 30px; 
            background: var(--card); border: 1px solid #45a29e; 
            border-radius: 20px; box-shadow: 0 0 60px rgba(0,0,0,0.8); 
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }

        /* شريط الحالة */
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #888; background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 50px; }
        
        /* شريط الوقت */
        .time-rail { width: 100%; height: 4px; background: #0b0c10; border-radius: 2px; overflow: hidden; }
        .time-fill { height: 100%; width: 0%; background: white; transition: width 0.1s linear; }

        /* العداد (للتحميل فقط) */
        .gauge-box { position: relative; width: 280px; height: 280px; margin: 0 auto; transition: opacity 0.3s; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        .track-bg { stroke: #0b0c10; stroke-width: 14; stroke-linecap: round; fill: none; }
        .track-fg { 
            stroke: var(--dl-color); stroke-width: 14; stroke-linecap: round; fill: none;
            stroke-dasharray: 615; stroke-dashoffset: 615; 
            transition: stroke-dashoffset 0.2s cubic-bezier(0.4, 0, 0.2, 1); /* حركة ناعمة جداً */
            filter: drop-shadow(0 0 10px var(--dl-color));
        }

        .center-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #dl-speed-main { font-size: 5rem; font-weight: 800; line-height: 0.9; letter-spacing: -3px; color: white; }
        .unit { font-size: 0.8rem; color: #888; margin-top: 5px; }

        /* منطقة الجيتر */
        .jitter-tag { margin-top: -30px; font-size: 0.9rem; color: #aaa; position: relative; z-index: 10; }
        .j-val { color: var(--ping-color); font-weight: bold; }

        /* البطاقات السفلية */
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .stat-card { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; 
            display: flex; flex-direction: column; transition: 0.3s; border: 1px solid transparent;
        }
        .head { font-size: 0.7rem; color: #666; font-weight: bold; margin-bottom: 5px; }
        .val { font-size: 1.2rem; font-weight: 900; direction: ltr; }

        /* بطاقة الرفع النشطة */
        .active-ul { 
            border-color: var(--ul-color); 
            background: rgba(170, 0, 255, 0.1); 
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.2); 
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border { 50% { border-color: transparent; box-shadow: none; } }

        /* الأزرار */
        .btn-start { 
            width: 100%; padding: 18px; border: none; border-radius: 12px; margin-top: 10px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem; cursor: pointer; 
        }
        .btn-start:hover { background: var(--dl-color); box-shadow: 0 0 20px var(--dl-color); }
        .btn-start:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }

        /* إخفاء العداد عند الرفع */
        .dimmed { opacity: 0.2; filter: grayscale(100%); }
    </style>
</head>
<body>
    <div class="sim-bg"></div>
    <div class="console">
        
        <div class="top-bar">
            <span id="srv-name">تلقائي (KSA)</span>
            <span id="timer-txt">0.0s</span>
        </div>

        <div class="time-rail"><div id="time-bar" class="time-fill"></div></div>

        <div id="main-gauge" class="gauge-box">
            <svg viewBox="0 0 260 260">
                <path class="track-bg" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="track-fill" class="track-fg" d="M 50 210 A 110 110 0 1 1 210 210" />
            </svg>
            <div class="center-hud">
                <div id="dl-speed-main">0.0</div>
                <div class="unit">DOWNLOAD</div>
            </div>
        </div>

        <div class="jitter-tag">
            استقرار (Jitter): <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="cards-grid">
            <div class="stat-card">
                <span class="head">PING</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div id="card-ul" class="stat-card">
                <span class="head">UPLOAD</span>
                <span id="res-ul" class="val" style="color:var(--ul-color)">--</span>
            </div>
            <div class="stat-card">
                <span class="head">JITTER</span>
                <span id="res-jitter" class="val" style="color:var(--ping-color)">--</span>
            </div>
        </div>

        <button id="start-btn" class="btn-start" onclick="startSimTest()">بدء الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
