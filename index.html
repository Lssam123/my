<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Network Analyzer | مشروع تخرج</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #0b0f1a; --card: rgba(23, 32, 53, 0.8); }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .dashboard { width: 95%; max-width: 900px; background: var(--card); border-radius: 30px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .grid-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .result-card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .result-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; }
        .val { font-size: 2rem; font-weight: bold; display: block; }
        .label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        
        .main-gauge { position: relative; width: 250px; height: 250px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 10px solid #1e293b; border-radius: 50%; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .speed-now { font-size: 4rem; font-weight: 800; background: linear-gradient(to bottom, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .ping-details { display: flex; justify-content: space-around; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-top: 20px; }
        .ping-box span { display: block; font-size: 0.7rem; color: #64748b; }
        .ping-box b { font-size: 1.1rem; color: var(--secondary); }

        .btn-container { text-align: center; margin-top: 30px; }
        .start-btn { padding: 15px 60px; border-radius: 50px; border: none; background: linear-gradient(45deg, var(--primary), var(--secondary)); color: #0b0f1a; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); }
        .start-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .status { margin-top: 15px; font-size: 0.9rem; color: var(--primary); height: 20px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h2 style="text-align:center; margin-top:0;">Network Performance Analyzer</h2>
        
        <div class="main-gauge">
            <span id="speed-display" class="speed-now">0</span>
            <span style="color:#64748b">Mbps</span>
        </div>

        <div class="grid-results">
            <div class="result-card">
                <i class="fas fa-download"></i>
                <span class="label">التحميل (Download)</span>
                <span id="download-res" class="val">0.00</span>
            </div>
            <div class="result-card">
                <i class="fas fa-upload"></i>
                <span class="label">الرفع (Upload)</span>
                <span id="upload-res" class="val">0.00</span>
            </div>
        </div>

        <div class="ping-details">
            <div class="ping-box"><span>Ping (خامل)</span><b id="ping-idle">--</b> ms</div>
            <div class="ping-box"><span>Ping (مُثقل)</span><b id="ping-loaded">--</b> ms</div>
            <div class="ping-box"><span>Jitter</span><b id="jitter">--</b> ms</div>
        </div>

        <div class="btn-container">
            <div id="status-text" class="status">جاهز للاختبار</div>
            <button id="main-action" class="start-btn" onclick="masterTest()">ابدأ الفحص الشامل</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
