<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V44 | Clean Restart</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #010103;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .master-panel {
            width: 850px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 50px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
        }

        /* العداد للداونلود فقط */
        .gauge-area {
            position: relative;
            width: 400px;
            height: 320px;
            margin: 0 auto;
        }

        .needle {
            position: absolute;
            bottom: 35%;
            width: 3px;
            height: 130px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.7s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon));
        }

        #dl-speed {
            font-size: 5.5rem;
            font-weight: 900;
            margin-top: 180px;
            display: block;
        }

        .unit-label { color: #444; font-weight: 900; letter-spacing: 3px; font-size: 0.8rem; }

        /* زر البدء الدائري */
        .btn-main {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: white;
            color: black;
            font-weight: 900;
            cursor: pointer;
            margin: 20px 0;
            transition: 0.3s;
        }

        .btn-main:hover { transform: scale(1.1); background: var(--neon); }
        .btn-main:disabled { opacity: 0.3; cursor: wait; }

        /* البطاقات السفلية */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255,255,255,0.01);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }
        .card .val { font-size: 1.8rem; font-weight: 900; display: block; height: 40px; }
        .card .lbl { font-size: 0.6rem; color: #555; font-weight: 900; text-transform: uppercase; }

        select {
            background: #111;
            color: var(--neon);
            border: 1px solid #222;
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="master-panel">
    <select id="isp-select">
        <option value="auto">تحديد تلقائي للأسرع</option>
        <option value="stc">STC - الاتصالات السعودية</option>
        <option value="mobily">Mobily - موبايلي</option>
        <option value="zain">Zain - زين</option>
        <option value="salam">Salam - سلام</option>
        <option value="go">GO - عذيب</option>
        <option value="dawiyat">Dawiyat - ضوئيات</option>
    </select>

    <div class="gauge-area">
        <svg viewBox="0 0 400 400" style="position:absolute; top:0; left:0; width:100%; height:100%;">
            <path d="M 100 300 A 140 140 0 1 1 300 300" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#222" font-size="11" font-weight="900" text-anchor="middle">
                <text x="85" y="310">0</text><text x="65" y="210">100</text>
                <text x="120" y="115">250</text><text x="200" y="90">500</text>
                <text x="285" y="115">750</text><text x="340" y="210">900</text>
                <text x="320" y="310">1000+</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <span id="dl-speed">0</span>
        <span class="unit-label">DOWNLOAD MBPS</span>
    </div>

    <button id="start-btn" class="btn-main" onclick="startFreshTest()">بدء</button>

    <div class="stats-row">
        <div class="card" id="c-ping">
            <span class="lbl">البنق (Ping)</span>
            <span id="v-ping" class="val">--</span>
        </div>
        <div class="card" id="c-jit">
            <span class="lbl">المثقل (Jitter)</span>
            <span id="v-jit" class="val">--</span>
        </div>
        <div class="card" id="c-ul">
            <span class="lbl">الرفع (Upload)</span>
            <span id="v-ul" class="val">--</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
