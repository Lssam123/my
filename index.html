<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V35 | المحلل المتقدم</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #020205;
            --card: rgba(10, 10, 15, 0.9);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية العداد الكبيرة */
        .gauge-master {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* رسم القوس الدائري */
        .gauge-arc {
            position: absolute;
            top: 0;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 10px solid rgba(255, 255, 255, 0.03);
            border-bottom-color: transparent;
            transform: rotate(-45deg);
        }

        /* الإبرة الضوئية المتحركة */
        .needle {
            position: absolute;
            bottom: 50px;
            width: 4px;
            height: 180px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: rotate(-120deg); /* البداية من الصفر */
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            filter: drop-shadow(0 0 10px var(--neon));
            z-index: 5;
        }

        .needle::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -8px;
            width: 20px;
            height: 20px;
            background: var(--neon);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon);
        }

        /* أرقام السرعة المركزية */
        .speed-center {
            text-align: center;
            z-index: 10;
            margin-bottom: 40px;
        }

        .speed-val {
            font-size: 9rem;
            font-weight: 900;
            line-height: 0.8;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(180deg, #fff 40%, var(--neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speed-unit {
            font-size: 1.2rem;
            color: #333;
            font-weight: 900;
            letter-spacing: 10px;
            margin-top: 15px;
        }

        /* اللوحة الأساسية */
        .main-panel {
            width: 900px;
            background: var(--card);
            backdrop-filter: blur(50px);
            border-radius: 80px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px;
            box-shadow: 0 100px 200px rgba(0,0,0,0.9);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 30px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-card .val { font-size: 2.5rem; font-weight: 900; color: #fff; }
        .stat-card .lbl { font-size: 0.7rem; color: #555; font-weight: 900; letter-spacing: 2px; }

        .btn-ignite {
            width: 100%;
            margin-top: 50px;
            background: #fff;
            color: #000;
            border: none;
            padding: 25px;
            border-radius: 100px;
            font-size: 1.6rem;
            font-weight: 950;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .btn-ignite:hover {
            background: var(--neon);
            box-shadow: 0 0 50px var(--neon);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="main-panel">
        <div class="gauge-master">
            <div class="gauge-arc"></div>
            <div id="needle" class="needle"></div>
            <div class="speed-center">
                <div id="dl-val" class="speed-val">0</div>
                <div class="speed-unit">MBPS</div>
            </div>
        </div>

        <div class="grid-stats">
            <div class="stat-card">
                <span class="lbl">IDLE PING</span>
                <span id="v-ping" class="val">--</span>
            </div>
            <div class="stat-card">
                <span class="lbl">LOADED PING</span>
                <span id="v-loaded" class="val">--</span>
            </div>
            <div class="stat-card">
                <span class="lbl">UPLOAD</span>
                <span id="v-ul" class="val">--</span>
            </div>
        </div>

        <button class="btn-ignite" onclick="runV35()">START ANALYSIS</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
