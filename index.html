<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V103 | 3D ENGINE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="space-bg"></div>
    
    <div class="stage-3d">
        <div class="dashboard-3d">
            
            <div class="glass-reflection"></div>

            <div class="hud-top">
                <div class="hud-item">
                    <span class="h-lbl">PING</span>
                    <span id="res-ping" class="h-val">-- <small>ms</small></span>
                </div>
                <div class="hud-item sep">
                    <span class="h-lbl">DOWNLOAD</span>
                    <span id="res-dl" class="h-val cyan">-- <small>Mbps</small></span>
                </div>
                <div class="hud-item">
                    <span class="h-lbl">UPLOAD</span>
                    <span id="res-ul" class="h-val purple">-- <small>Mbps</small></span>
                </div>
            </div>

            <div class="server-slot">
                <select id="srv-select" class="holo-select">
                    <option value="auto">📡 AUTO SELECT (الأسرع)</option>
                    <option value="stc">STC (Saudi Telecom)</option>
                    <option value="mobily">Mobily (Etisalat)</option>
                    <option value="zain">Zain KSA</option>
                    <option value="salam">Salam Integrated</option>
                    <option value="go">GO Telecom</option>
                    <option value="dawiyat">Dawiyat Fiber</option>
                </select>
            </div>

            <div class="reactor-3d">
                <div class="ring-back"></div>
                <div class="ring-middle"></div>
                <div class="ring-front">
                    <svg viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="g-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F260"/><stop offset="1" stop-color="#0575E6"/></linearGradient>
                            <linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b20a2c"/><stop offset="1" stop-color="#fffbd5"/></linearGradient>
                        </defs>
                        <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                        <path id="track-active" class="track-fg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#g-cyan)" />
                    </svg>
                </div>
                <div id="needle" class="needle-3d"></div>
                
                <div class="core-text">
                    <div id="live-val">0</div>
                    <div id="phase-lbl" class="phase">SYSTEM READY</div>
                </div>
            </div>

            <div class="live-metrics-3d">
                <div class="metric-row">
                    <span>Loaded Ping (Jitter)</span>
                    <span id="live-loaded" class="m-val warning">--</span>
                    <span class="unit">ms</span>
                </div>
                <div class="graph-3d"><div id="jitter-bar" class="bar-fill"></div></div>
            </div>

            <button id="start-btn" class="holo-btn" onclick="start3DTest()">INITIATE SEQUENCE</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
