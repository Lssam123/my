<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المحلل السعودي V32 | فحص المسارات المتعددة</title>
    <style>
        :root { --neon: #00f2fe; --bg: #010103; --panel: rgba(10, 10, 15, 0.95); }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .master-box { width: 90%; max-width: 820px; background: var(--panel); padding: 50px; border-radius: 60px; border: 1px solid #1a1a25; text-align: center; box-shadow: 0 40px 120px rgba(0,0,0,0.8); }
        
        .status-bar { font-size: 0.75rem; color: #444; margin-bottom: 20px; font-weight: 800; letter-spacing: 1px; }
        .main-speed { font-size: 11rem; font-weight: 950; color: var(--neon); line-height: 0.8; font-family: 'Arial Black', sans-serif; letter-spacing: -8px; }
        .unit { font-size: 1.3rem; color: #222; font-weight: 900; letter-spacing: 10px; margin-top: 15px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 50px; }
        .card { background: #08080c; padding: 25px 15px; border-radius: 35px; border: 1px solid #111; transition: 0.4s; }
        .card.active { border-color: var(--neon); box-shadow: 0 0 25px rgba(0, 242, 254, 0.1); }
        .card .v { font-size: 2.7rem; font-weight: 900; display: block; }
        .card .l { font-size: 0.65rem; color: #555; font-weight: 900; margin-bottom: 8px; display: block; }

        .btn-ignite { width: 100%; margin-top: 45px; background: #fff; color: #000; border: none; padding: 25px; border-radius: 100px; font-size: 1.6rem; font-weight: 950; cursor: pointer; transition: 0.4s; }
        .btn-ignite:hover { background: var(--neon); transform: scale(1.01); box-shadow: 0 10px 40px rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body>
    <div class="master-box">
        <div id="path-info" class="status-bar">جاري فحص أفضل مسار للبيانات...</div>
        <div class="main-speed" id="dl-display">0</div>
        <div class="unit">Mbps DOWNLOAD</div>

        <div class="stats-grid">
            <div class="card" id="c1"><span class="l">بينق المسار</span><span id="v-ping" class="v">--</span></div>
            <div class="card" id="c2"><span class="l">بينق مثقل</span><span id="v-loaded" class="v">--</span></div>
            <div class="card" id="c3"><span class="l">رفع فائق</span><span id="v-ul" class="v">--</span></div>
        </div>

        <button class="btn-ignite" onclick="runV32()">تشغيل محرك V32</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
