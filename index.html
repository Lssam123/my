<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V145 | ORBITAL</title>
    <style>
        /* --- تصميم المدار V145 --- */
        :root {
            --dl: #00f2ea;       /* سماوي ساطع */
            --ul: #ff0050;       /* أحمر نيون */
            --ping: #ffcc00;     /* ذهبي */
            --bg: #050505;
            --glass: rgba(20, 20, 25, 0.9);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .orbital-bg {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 10%, #1a202c 0%, #000 90%);
            z-index: -1;
        }

        .main-unit {
            width: 95%; max-width: 500px; padding: 30px;
            background: var(--glass); border: 1px solid #333;
            border-radius: 30px; box-shadow: 0 0 100px rgba(0, 242, 234, 0.05);
            display: flex; flex-direction: column; gap: 20px;
            backdrop-filter: blur(20px);
        }

        /* الرأس */
        .header-status {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .srv-badge { 
            background: rgba(0, 242, 234, 0.1); color: var(--dl); 
            padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 0.8rem;
            border: 1px solid rgba(0, 242, 234, 0.3);
        }
        .timer-txt { font-family: monospace; color: #666; font-size: 1rem; }

        /* العداد */
        .gauge-zone { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-bg { stroke: #151515; stroke-width: 12; stroke-linecap: round; fill: none; }
        .track-fg { 
            stroke: var(--dl); stroke-width: 12; stroke-linecap: round; fill: none;
            stroke-dasharray: 615; stroke-dashoffset: 615; 
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 15px var(--dl));
        }

        .hud-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        #speed-main { font-size: 5rem; font-weight: 900; line-height: 0.9; letter-spacing: -3px; color: #fff; }
        .unit-lbl { font-size: 0.8rem; color: #666; text-transform: uppercase; margin-top: 5px; }
        .phase-lbl { font-size: 1rem; font-weight: bold; color: var(--dl); margin-top: 5px; }

        /* شريط الوقت */
        .time-wrapper { width: 100%; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .time-fill { height: 100%; width: 0%; background: white; transition: width 0.1s linear; }

        /* منطقة الجيتر المتزامن */
        .sync-jitter-box {
            background: rgba(255, 204, 0, 0.05); padding: 8px 16px; border-radius: 12px;
            border: 1px solid rgba(255, 204, 0, 0.2); display: flex; justify-content: space-between; align-items: center;
        }
        .j-lbl { font-size: 0.8rem; color: #aaa; }
        .j-val { font-size: 1.1rem; font-weight: bold; color: var(--ping); }

        /* الشبكة */
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .stat-card { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; 
            display: flex; flex-direction: column; text-align: center;
        }
        .s-head { font-size: 0.65rem; color: #666; font-weight: bold; margin-bottom: 5px; }
        .s-val { font-size: 1.1rem; font-weight: 900; direction: ltr; }

        /* الأزرار */
        .btn-start { 
            width: 100%; padding: 18px; border: none; border-radius: 10px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; 
        }
        .btn-start:hover { background: var(--dl); box-shadow: 0 0 30px var(--dl); }
        .btn-start:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>
    <div class="orbital-bg"></div>
    <div class="main-unit">
        
        <div class="header-status">
            <span class="srv-badge" id="srv-display">تلقائي (KSA)</span>
            <span class="timer-txt" id="timer">0.0s</span>
        </div>

        <div class="time-wrapper"><div id="progress" class="time-fill"></div></div>

        <div class="gauge-zone">
            <svg viewBox="0 0 260 260">
                <path class="track-bg" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="gauge-path" class="track-fg" d="M 50 210 A 110 110 0 1 1 210 210" />
            </svg>
            <div class="hud-center">
                <div id="speed-main">0.0</div>
                <div class="unit-lbl">Mbps</div>
                <div id="phase-txt" class="phase-lbl">جاهز</div>
            </div>
        </div>

        <div class="sync-jitter-box">
            <span class="j-lbl">البنق المثقل (تحت الضغط):</span>
            <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <span class="s-head">PING</span>
                <span id="res-ping" class="s-val">--</span>
            </div>
            <div class="stat-card">
                <span class="s-head">JITTER</span>
                <span id="res-jitter" class="s-val" style="color:var(--ping)">--</span>
            </div>
            <div class="stat-card">
                <span class="s-head">DOWN</span>
                <span id="res-dl" class="s-val" style="color:var(--dl)">--</span>
            </div>
            <div class="stat-card">
                <span class="s-head">UP</span>
                <span id="res-ul" class="s-val" style="color:var(--ul)">--</span>
            </div>
        </div>

        <button id="start-btn" class="btn-start" onclick="startOrbitalTest()">بدء الفحص</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
