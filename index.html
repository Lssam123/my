<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V90 | STABLE CORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="main-interface">
        
        <div class="top-history">
            <div class="hist-item">
                <span class="h-lbl">PING</span>
                <span id="final-ping" class="h-val">-- ms</span>
            </div>
            <div class="hist-item border-x">
                <span class="h-lbl">DOWNLOAD</span>
                <span id="final-dl" class="h-val dl-text">--</span>
            </div>
            <div class="hist-item">
                <span class="h-lbl">UPLOAD</span>
                <span id="final-ul" class="h-val ul-text">--</span>
            </div>
        </div>

        <div class="controls">
            <select id="server-select" class="tech-select">
                <option value="auto">⚡ تلقائي (أفضل استجابة)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat Fiber</option>
            </select>
        </div>

        <div class="gauge-wrapper">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-circle">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="grad-dl" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="grad-ul" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="track-active" class="track-fg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#grad-dl)" />
                </svg>
                <div id="needle" class="needle-arrow"></div>
            </div>
            
            <div class="center-text">
                <div id="live-speed">0</div>
                <div id="status-phase" class="status-phase">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="live-jitter-section">
            <div class="jitter-head">
                <span>البنق المثقل (Live Jitter)</span>
                <span id="live-jitter-val" class="jitter-val">--</span>
                <span class="ms">ms</span>
            </div>
            <div class="jitter-graph-track">
                <div id="jitter-bar" class="jitter-bar-fill"></div>
            </div>
        </div>

        <button id="action-btn" class="action-btn" onclick="startEngineV90()">START TEST</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
