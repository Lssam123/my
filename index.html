<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Elite V54 | Perfect Alignment</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #020308;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .master-panel {
            width: 850px; background: var(--glass); backdrop-filter: blur(50px);
            border-radius: 60px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        .server-select {
            background: #111; color: var(--neon); border: 1px solid #333;
            padding: 10px 25px; border-radius: 100px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        /* حاوية العداد الكبرى */
        .gauge-module {
            position: relative;
            width: 480px;
            height: 350px; /* مساحة كافية للعداد والأرقام */
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG العداد */
        .gauge-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* الإبرة المصححة */
        .needle {
            position: absolute;
            bottom: 60px; /* نقطة ارتكاز الإبرة بناءً على رسم القوس */
            left: 50%;
            width: 4px;
            height: 150px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon));
            z-index: 5;
        }

        /* الرقم المركزي - الآن في وسط العداد تماماً */
        .speed-readout {
            position: absolute;
            top: 55%; /* وضع الرقم في مركز القوس */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
        }

        #speed-num {
            font-size: 6.5rem;
            font-weight: 950;
            font-family: 'Arial Black', sans-serif;
            line-height: 1;
            display: block;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }

        .unit-label {
            color: #444;
            font-weight: 900;
            letter-spacing: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* الأزرار والبطاقات */
        .btn-start {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: #fff; color: #000; font-weight: 950; cursor: pointer;
            margin-top: 30px; transition: 0.4s;
        }
        .btn-start:hover { transform: scale(1.1); background: var(--neon); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.01); padding: 25px; border-radius: 30px; border: 1px solid var(--border); }
        .card .v { font-size: 2.2rem; font-weight: 900; color: #fff; display: block; }
        .card .l { font-size: 0.7rem; color: #555; font-weight: 900; }
    </style>
</head>
<body>

<div class="master-panel">
    <select id="isp-node" class="server-select">
        <option value="auto">⚡ تحديد تلقائي للسيرفر الأسرع</option>
        <option value="stc">STC - الاتصالات السعودية</option>
        <option value="mobily">Mobily - موبايلي</option>
        <option value="zain">Zain - زين السعودية</option>
        <option value="salam">Salam - سلام</option>
        <option value="go">GO - عذيب</option>
        <option value="dawiyat">Dawiyat - ضوئيات</option>
    </select>

    <div class="gauge-module">
        <svg class="gauge-svg" viewBox="0 0 400 300">
            <path d="M 50 240 A 150 150 0 0 1 350 240" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="14" font-weight="950" text-anchor="middle">
                <text x="50" y="270">0</text>
                <text x="65" y="170">100</text>
                <text x="130" y="110">200</text>
                <text x="200" y="90">300</text>
                <text x="270" y="110">400</text>
                <text x="350" y="270">500</text>
            </g>
        </svg>
        
        <div id="needle" class="needle"></div>
        
        <div class="speed-readout">
            <span id="speed-num">0</span>
            <span class="unit-label">MBPS DOWNLOAD</span>
        </div>
    </div>

    <button id="main-btn" class="btn-start" onclick="runV54()">بدء</button>

    <div class="stats-grid">
        <div class="card"><span class="l">IDLE PING (ms)</span><span id="v-ping" class="v">--</span></div>
        <div class="card"><span class="l">LOADED PING (ms)</span><span id="v-load" class="v">--</span></div>
        <div class="card"><span class="l">UPLOAD (Mbps)</span><span id="v-ul" class="v">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
