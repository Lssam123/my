<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V134 | القناص</title>
    <style>
        /* --- تصميم القناص V134 --- */
        :root { --main: #00ffaa; --sec: #7000ff; --bg: #050505; --glass: rgba(20,20,20,0.95); }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .sniper-bg { 
            position: fixed; width: 100%; height: 100%; 
            background: 
                linear-gradient(rgba(0, 255, 170, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.5; z-index: -1;
        }

        .main-console { 
            width: 95%; max-width: 480px; padding: 30px; 
            background: var(--glass); border: 1px solid #333; 
            border-radius: 20px; box-shadow: 0 0 80px rgba(0,0,0,0.9); 
            text-align: center; position: relative;
        }

        /* شريط الحالة */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 50px;
            font-size: 0.8rem; color: #aaa; margin-bottom: 20px;
        }
        .status-dot { width: 8px; height: 8px; background: var(--main); border-radius: 50%; box-shadow: 0 0 10px var(--main); }

        /* العداد */
        .gauge-area { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-bg { stroke: #111; stroke-width: 12; stroke-linecap: butt; fill: none; }
        .track-val { 
            stroke: var(--main); stroke-width: 12; stroke-linecap: butt; fill: none;
            stroke-dasharray: 615; stroke-dashoffset: 615; 
            transition: stroke-dashoffset 0.1s linear;
            filter: drop-shadow(0 0 8px var(--main));
        }

        .center-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #live-num { font-size: 5rem; font-weight: 800; line-height: 0.9; letter-spacing: -3px; }
        .phase-lbl { font-size: 1rem; font-weight: bold; color: var(--main); margin-top: 5px; }
        .unit { font-size: 0.8rem; color: #666; }

        /* منطقة الجيتر */
        .jitter-tag { 
            background: #111; padding: 5px 15px; border-radius: 20px; border: 1px solid #333;
            display: inline-block; margin-top: -30px; z-index: 10; font-size: 0.8rem; color: #888;
        }
        .j-val { color: #ffcc00; font-weight: bold; font-size: 1rem; margin-right: 5px; }

        /* شبكة النتائج */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 20px; 
        }
        .stat-box { 
            background: rgba(255,255,255,0.03); padding: 12px 5px; border-radius: 10px; 
            display: flex; flex-direction: column; 
        }
        .s-lbl { font-size: 0.6rem; color: #666; font-weight: bold; margin-bottom: 5px; }
        .s-val { font-size: 1rem; font-weight: 900; direction: ltr; }

        /* الأزرار */
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-main { 
            flex: 3; padding: 16px; border: none; border-radius: 10px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; 
        }
        .btn-main:hover { background: var(--main); box-shadow: 0 0 25px var(--main); }
        .btn-main:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .btn-reload { 
            flex: 1; border: 1px solid #333; background: transparent; border-radius: 10px;
            color: white; font-size: 1.5rem; cursor: pointer; transition: 0.3s; 
        }
        .btn-reload:hover { color: var(--sec); border-color: var(--sec); }

        /* شريط الوقت */
        .time-line { width: 100%; height: 4px; background: #222; margin-top: 15px; border-radius: 2px; }
        .time-fill { height: 100%; width: 0%; background: var(--main); transition: width 0.1s linear; }
    </style>
</head>
<body>
    <div class="sniper-bg"></div>
    <div class="main-console">
        
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap:10px">
                <div class="status-dot"></div>
                <span id="srv-txt">جاهز للفحص</span>
            </div>
            <div id="timer">00s</div>
        </div>

        <div class="gauge-area">
            <svg viewBox="0 0 260 260">
                <defs>
                    <linearGradient id="g-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ffaa"/><stop offset="1" stop-color="#00aaff"/></linearGradient>
                    <linearGradient id="g-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7000ff"/><stop offset="1" stop-color="#ff0066"/></linearGradient>
                </defs>
                <path class="track-bg" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="track-fill" class="track-val" d="M 50 210 A 110 110 0 1 1 210 210" stroke="url(#g-dl)" />
            </svg>
            <div class="center-hud">
                <div id="live-num">0.0</div>
                <div class="unit">ميجابت/ثانية</div>
                <div id="phase-lbl">استعداد</div>
            </div>
        </div>

        <div class="jitter-tag">
            استقرار الخط: <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="time-line"><div id="time-bar" class="time-fill"></div></div>

        <div class="stats-grid">
            <div class="stat-box">
                <span class="s-lbl">PING</span>
                <span id="res-ping" class="s-val">--</span>
            </div>
            <div class="stat-box">
                <span class="s-lbl">JITTER</span>
                <span id="res-jitter" class="s-val" style="color:#ffcc00">--</span>
            </div>
            <div class="stat-box">
                <span class="s-lbl">DOWN</span>
                <span id="res-dl" class="s-val" style="color:var(--main)">--</span>
            </div>
            <div class="stat-box">
                <span class="s-lbl">UP</span>
                <span id="res-ul" class="s-val" style="color:var(--sec)">--</span>
            </div>
        </div>

        <div class="btn-row">
            <button id="start-btn" class="btn-main" onclick="startSniperTest()">بدء الفحص</button>
            <button class="btn-reload" onclick="resetAll()">↺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
