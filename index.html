<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite | المحلل العالمي</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #030008;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* جزيئات خلفية متحركة */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(112, 0, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
            animation: pulseBg 10s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { opacity: 0.5; } 100% { opacity: 1; }
        }

        .master-hub {
            position: relative;
            width: 100%;
            max-width: 850px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 60px;
            border: 1px solid var(--border);
            padding: 60px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
            text-align: center;
        }

        /* السيرفر */
        .server-box { margin-bottom: 40px; }
        .server-select {
            background: rgba(255,255,255,0.05);
            color: var(--neon);
            border: 1px solid var(--border);
            padding: 12px 30px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }
        .server-select:hover { border-color: var(--neon); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }

        /* العداد الدائري */
        .gauge-wrap {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.03);
        }

        .ring-active {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--neon);
            filter: drop-shadow(0 0 15px var(--neon));
            transform: rotate(-45deg);
            transition: 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        .speed-content { z-index: 10; }
        .speed-val {
            font-size: 8rem;
            font-weight: 950;
            font-family: 'Arial Black', sans-serif;
            line-height: 0.9;
            background: linear-gradient(to bottom, #fff, var(--neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .speed-unit { font-size: 1rem; color: #444; letter-spacing: 8px; font-weight: 900; margin-top: 10px; }

        /* الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 50px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 25px 15px;
            border-radius: 30px;
            border: 1px solid var(--border);
            transition: 0.4s;
        }

        .stat-card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }

        .stat-card .lbl { font-size: 0.65rem; color: #555; text-transform: uppercase; font-weight: 900; margin-bottom: 10px; display: block; }
        .stat-card .val { font-size: 2.2rem; font-weight: 900; color: #fff; }

        /* زر التشغيل */
        .btn-launch {
            width: 100%;
            margin-top: 50px;
            background: #fff;
            color: #000;
            border: none;
            padding: 24px;
            border-radius: 100px;
            font-size: 1.6rem;
            font-weight: 950;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-launch:hover {
            background: var(--neon);
            transform: scale(1.02);
            box-shadow: 0 0 50px var(--neon);
        }

        .btn-launch:disabled { opacity: 0.1; cursor: wait; }

    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="master-hub">
        <div class="server-box">
            <select id="server-select" class="server-select" onchange="manualNode()">
                <option value="auto">⚡ SMART AUTO-SELECT</option>
                <option value="stc">STC - Riyadh</option>
                <option value="mobily">Mobily - Jeddah</option>
                <option value="zain">Zain - Saudi</option>
                <option value="salam">Salam - Integrated</option>
                <option value="go">GO - Atheeb</option>
            </select>
        </div>

        <div class="gauge-wrap">
            <div class="ring-bg"></div>
            <div id="ring" class="ring-active"></div>
            <div class="speed-content">
                <div id="dl-val" class="speed-val">0</div>
                <div class="speed-unit">MBPS</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card" id="c-ping">
                <span class="lbl">Idle Ping</span>
                <span id="v-ping" class="val">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="c-loaded">
                <span class="lbl">Loaded Ping</span>
                <span id="v-loaded" class="val">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="c-ul">
                <span class="lbl">Upload</span>
                <span id="v-ul" class="val">--</span><small>Mbps</small>
            </div>
        </div>

        <button class="btn-launch" onclick="startEliteTest()">Launch Analysis</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
