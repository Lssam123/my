<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V126 | PRECISION</title>
    <style>
        /* --- تصميم V126 الدقيق --- */
        :root { --main: #00e5ff; --sec: #ff0055; --bg: #0a0b10; --glass: rgba(20, 25, 35, 0.95); }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        .grid-bg { 
            position: fixed; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .dashboard { 
            width: 95%; max-width: 460px; padding: 25px; 
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; box-shadow: 0 0 80px rgba(0,0,0,0.8); 
            text-align: center; position: relative;
        }

        /* شريط الوقت */
        .progress-track { width: 100%; height: 4px; background: #222; margin-bottom: 20px; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--main); transition: width 0.2s linear; }

        /* النتائج */
        .stats-deck { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; }
        .stat-cell { display: flex; flex-direction: column; border-left: 1px solid #333; }
        .stat-cell:last-child { border-left: none; }
        .lbl { font-size: 0.65rem; color: #888; font-weight: bold; letter-spacing: 1px; }
        .val { font-size: 1rem; font-weight: 900; margin-top: 5px; }
        .c-main { color: var(--main); } .c-sec { color: var(--sec); } .c-warn { color: #ffd700; }

        .server-select { width: 100%; background: #000; color: white; border: 1px solid #444; padding: 12px; border-radius: 8px; margin-bottom: 25px; font-weight: bold; outline: none; }

        /* العداد */
        .gauge-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        .track-base { stroke: #1a1a1a; stroke-width: 14; stroke-linecap: round; fill: none; }
        .track-active { 
            stroke: var(--main); stroke-width: 14; stroke-linecap: round; fill: none; 
            stroke-dasharray: 565; stroke-dashoffset: 565; /* محيط الدائرة الناقص */
            transition: stroke-dashoffset 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
            filter: drop-shadow(0 0 8px var(--main));
        }

        .center-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #speed-val { font-size: 4.5rem; font-weight: 900; line-height: 0.9; letter-spacing: -3px; }
        .status-txt { font-size: 0.9rem; font-weight: bold; color: var(--main); margin-top: 5px; }
        .unit { font-size: 0.8rem; color: #666; }

        /* منطقة الجيتر */
        .jitter-row { margin-top: -20px; margin-bottom: 25px; font-size: 0.85rem; color: #aaa; position: relative; z-index: 5; }
        .j-val { color: #ffd700; font-weight: bold; margin-left: 5px; font-size: 1.1rem; }

        .action-btn { 
            width: 100%; padding: 18px; border: none; border-radius: 12px;
            background: white; color: black; font-weight: 900; font-size: 1.2rem; 
            cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .action-btn:hover { background: var(--main); box-shadow: 0 0 30px var(--main); }
        .action-btn:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="dashboard">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>

        <div class="stats-deck">
            <div class="stat-cell">
                <span class="lbl">PING</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div class="stat-cell">
                <span class="lbl">JITTER</span>
                <span id="res-jitter" class="val c-warn">--</span>
            </div>
            <div class="stat-cell">
                <span class="lbl">DOWN</span>
                <span id="res-dl" class="val c-main">--</span>
            </div>
            <div class="stat-cell">
                <span class="lbl">UP</span>
                <span id="res-ul" class="val c-sec">--</span>
            </div>
        </div>

        <select id="server-select" class="server-select">
            <option value="auto">📡 تلقائي (AUTO BEST)</option>
            <optgroup label="Saudi Arabia">
                <option value="stc">STC (Saudi Telecom)</option>
                <option value="mobily">Mobily</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam</option>
                <option value="go">GO Telecom</option>
            </optgroup>
        </select>

        <div class="gauge-container">
            <svg viewBox="0 0 240 240">
                <path class="track-base" d="M 40 120 A 80 80 0 1 1 200 120" /> 
                <path class="track-base" d="M 20 220 A 110 110 0 1 1 220 220" /> 
                <path id="gauge-path" class="track-active" d="M 20 220 A 110 110 0 1 1 220 220" />
            </svg>
            <div class="center-hud">
                <div id="speed-val">0.0</div>
                <div id="status-txt" class="status-txt">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="jitter-row">
            Active Jitter: <span id="live-jitter" class="j-val">--</span>
        </div>

        <button id="start-btn" class="action-btn" onclick="startEngine()">START TEST</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
