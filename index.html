<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل الشبكة الدقيق | Precision V21</title>
    <style>
        :root { --neon: #00f2fe; --bg: #08080a; --card: #121215; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 700px; background: var(--card); padding: 40px; border-radius: 35px; border: 1px solid #222; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.7); }
        .main-speed { margin-bottom: 30px; }
        .speed-num { font-size: 9rem; font-weight: 900; color: var(--neon); line-height: 1; font-family: 'Consolas', monospace; }
        .unit { font-size: 1.2rem; color: #444; font-weight: bold; letter-spacing: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
        .stat-box { background: #1a1a1e; padding: 20px 10px; border-radius: 20px; border: 1px solid #282828; }
        .stat-box.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }
        .label { display: block; font-size: 0.7rem; color: #666; font-weight: bold; margin-bottom: 8px; }
        .value { font-size: 1.8rem; font-weight: 800; color: #eee; }
        .btn-start { width: 100%; margin-top: 35px; background: #fff; color: #000; border: none; padding: 20px; border-radius: 100px; font-size: 1.4rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-start:hover { background: var(--neon); transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 242, 254, 0.3); }
        .btn-start:disabled { opacity: 0.2; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.8rem; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <span style="color:#333; letter-spacing: 3px; font-weight: 900; font-size: 0.8rem;">ULTRA-PRECISION ENGINE</span>
        <div class="main-speed">
            <div id="dl-val" class="speed-num">0</div>
            <div class="unit">Mbps DOWNLOAD</div>
        </div>
        <div class="stats-grid">
            <div class="stat-box" id="b-ping">
                <span class="label">البينق (HEAD)</span>
                <span id="v-ping" class="value">--</span><small>ms</small>
            </div>
            <div class="stat-box" id="b-loaded">
                <span class="label">البينق المثقل</span>
                <span id="v-loaded" class="value">--</span><small>ms</small>
            </div>
            <div class="stat-box" id="b-ul">
                <span class="label">الرفع (Stable)</span>
                <span id="v-ul" class="value">--</span><small>Mbps</small>
            </div>
        </div>
        <button class="btn-start" onclick="initTest()">ابدأ فحص الدقة</button>
        <div id="status">جاهز للمعايرة (Edge Nodes Active)</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
