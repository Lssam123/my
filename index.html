<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V37 | Cockpit Edition</title>
    <style>
        :root {
            --neon: #00f2fe;
            --purple: #7000ff;
            --bg: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #66fcf1;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 900px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* الجزء العلوي: اختيار السيرفر والزر */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #15151b;
            padding: 20px 40px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .server-info { display: flex; flex-direction: column; gap: 5px; }
        .server-info label { font-size: 0.7rem; color: #555; font-weight: bold; }
        
        .server-select {
            background: transparent;
            color: var(--neon);
            border: 1px solid #444;
            padding: 8px 15px;
            border-radius: 10px;
            outline: none;
            cursor: pointer;
        }

        .btn-start {
            background: white;
            color: black;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-start:hover { background: var(--neon); box-shadow: 0 0 20px var(--neon); }

        /* وحدة العداد المركزية - منفصلة تماماً */
        .gauge-module {
            background: #15151b;
            border-radius: 30px;
            padding: 60px 20px;
            border: 1px solid #333;
            margin-bottom: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge-svg { width: 450px; height: 250px; }

        .gauge-bg { fill: none; stroke: #222; stroke-width: 15; stroke-linecap: round; }
        .gauge-fill { 
            fill: none; stroke: var(--neon); stroke-width: 15; stroke-linecap: round;
            stroke-dasharray: 628; stroke-dashoffset: 628; 
            transition: stroke-dashoffset 0.5s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 8px var(--neon));
        }

        /* أرقام التدريج داخل العداد */
        .gauge-ticks { font-size: 12px; fill: #444; font-weight: bold; }

        .speed-display { text-align: center; margin-top: -60px; }
        .speed-num { font-size: 6rem; font-weight: 900; color: white; line-height: 1; }
        .speed-unit { font-size: 1.2rem; color: var(--neon); font-weight: bold; letter-spacing: 5px; }

        /* شبكة البطاقات السفلية - منظمة ومنفصلة */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: #15151b;
            padding: 30px;
            border-radius: 25px;
            border: 1px solid #333;
            text-align: right;
            position: relative;
        }

        .stat-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 0%; height: 4px;
            background: var(--neon); border-radius: 0 0 0 25px; transition: 0.5s;
        }
        .stat-card.active::after { width: 100%; }

        .card-title { font-size: 0.8rem; color: #555; display: block; margin-bottom: 10px; font-weight: 900; }
        .card-val { font-size: 2.5rem; font-weight: 900; color: var(--neon); display: block; }
        .card-unit { font-size: 0.9rem; color: white; }

    </style>
</head>
<body>

<div class="main-container">
    <div class="header-panel">
        <div class="server-info">
            <label>سيرفر الفحص</label>
            <select id="server-select" class="server-select" onchange="manualNode()">
                <option value="auto">تحديد تلقائي ذكي</option>
                <option value="stc">STC - السعودية</option>
                <option value="mobily">Mobily - موبايلي</option>
                <option value="zain">Zain - السعودية</option>
                <option value="salam">Salam - سلام</option>
                <option value="go">GO - عذيب</option>
            </select>
        </div>
        <button class="btn-start" onclick="runV37()">إبدأ الفحص</button>
    </div>

    <div class="gauge-module">
        <svg class="gauge-svg" viewBox="0 0 400 200">
            <path class="gauge-bg" d="M 50 180 A 150 150 0 0 1 350 180" />
            <path id="gauge-progress" class="gauge-fill" d="M 50 180 A 150 150 0 0 1 350 180" />
            
            <text x="40" y="195" class="gauge-ticks">0</text>
            <text x="35" y="140" class="gauge-ticks">100</text>
            <text x="70" y="80" class="gauge-ticks">250</text>
            <text x="185" y="45" class="gauge-ticks">500</text>
            <text x="300" y="80" class="gauge-ticks">750</text>
            <text x="345" y="140" class="gauge-ticks">900</text>
            <text x="340" y="195" class="gauge-ticks">1000+</text>
        </svg>

        <div class="speed-display">
            <div id="dl-val" class="speed-num">0</div>
            <div class="speed-unit">Mbps</div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card" id="c-ping">
            <span class="card-title">البنق الخامل</span>
            <span id="v-ping" class="card-val">--</span>
            <span class="card-unit">ms</span>
        </div>
        <div class="stat-card" id="c-loaded">
            <span class="card-title">البنق المثقل</span>
            <span id="v-loaded" class="card-val">--</span>
            <span class="card-unit">ms</span>
        </div>
        <div class="stat-card" id="c-ul">
            <span class="card-title">سرعة الرفع</span>
            <span id="v-ul" class="card-val">--</span>
            <span class="card-unit">Mbps</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
