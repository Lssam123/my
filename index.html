<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Elite V46 | Auto-Radar & Turbo UL</title>
    <style>
        :root { --neon: #00f2fe; --bg: #020205; --border: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { width: 850px; background: rgba(255,255,255,0.02); backdrop-filter: blur(50px); border-radius: 50px; padding: 40px; border: 1px solid var(--border); text-align: center; }
        
        /* العداد */
        .gauge-box { position: relative; width: 450px; height: 300px; margin: 0 auto; }
        .needle { position: absolute; bottom: 20px; left: 50%; width: 4px; height: 140px; background: linear-gradient(to top, transparent, var(--neon)); transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg); transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1); filter: drop-shadow(0 0 8px var(--neon)); }
        
        /* الأرقام */
        .speed-val { font-size: 6rem; font-weight: 900; font-family: 'Arial Black'; line-height: 1; margin-top: -20px; }
        .label { color: var(--neon); letter-spacing: 3px; font-size: 0.8rem; font-weight: 900; }

        /* البطاقات */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.02); padding: 25px; border-radius: 30px; border: 1px solid var(--border); position: relative; }
        .card.active { border-color: var(--neon); box-shadow: 0 0 15px rgba(0,242,254,0.1); }
        .card .v { font-size: 2.2rem; font-weight: 900; display: block; }
        .card .l { font-size: 0.7rem; color: #555; font-weight: 900; }

        .btn { width: 100px; height: 100px; border-radius: 50%; background: #fff; color: #000; border: none; font-size: 1.2rem; font-weight: 900; cursor: pointer; margin-top: 30px; transition: 0.4s; }
        .btn:hover { transform: scale(1.1); background: var(--neon); }
        
        #node-info { font-size: 0.8rem; color: #444; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="panel">
    <div id="node-info">جاري البحث عن أفضل سيرفر...</div>
    
    <div class="gauge-box">
        <svg viewBox="0 0 400 200" style="width:100%;">
            <path d="M 50 180 A 150 150 0 0 1 350 180" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="12" font-weight="900" text-anchor="middle">
                <text x="50" y="198">0</text><text x="125" y="65">200</text><text x="275" y="65">400</text><text x="350" y="198">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
    </div>

    <div class="speed-val" id="main-num">0</div>
    <div class="label" id="status">READY</div>

    <button class="btn" id="go-btn" onclick="startV46()">بدء</button>

    <div class="grid">
        <div class="card" id="p-card"><span class="l">PING</span><span class="v" id="res-p">--</span></div>
        <div class="card" id="j-card"><span class="l">JITTER</span><span class="v" id="res-j">--</span></div>
        <div class="card" id="u-card"><span class="l">UPLOAD</span><span class="v" id="res-u">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
