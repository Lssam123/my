<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محلل الشبكة الاحترافي - الإصدار الرابع عشر</title>
    <style>
        :root { --accent: #00f2fe; --bg: #0a0a0c; --stc: #4f2d7f; --mobily: #0067b1; --zain: #91278f; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .panel { width: 95%; max-width: 850px; background: #121214; padding: 40px; border-radius: 35px; border: 1px solid #222; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        
        /* رادار البينق المحلي */
        .ping-radar { display: flex; gap: 10px; margin-bottom: 30px; }
        .ping-box { flex: 1; padding: 15px; border-radius: 15px; background: #1a1a1c; text-align: center; border-bottom: 3px solid #333; }
        .ping-box span { display: block; font-size: 1.2rem; font-weight: 900; margin-top: 5px; }
        .stc { border-color: var(--stc); } .mobily { border-color: var(--mobily); } .zain { border-color: var(--zain); }

        .hero { text-align: center; margin: 40px 0; }
        .speed-num { font-size: 11rem; font-weight: 950; background: linear-gradient(180deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.8; font-family: 'Arial Black'; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #1a1a1c; padding: 25px 15px; border-radius: 20px; text-align: center; border: 1px solid #222; }
        .card.active { border-color: var(--accent); background: #1d2526; }
        .label { font-size: 0.75rem; color: #666; font-weight: bold; margin-bottom: 10px; display: block; }
        .val { font-size: 2rem; font-weight: 900; }

        .start-btn { width: 100%; margin-top: 30px; background: #fff; color: #000; border: none; padding: 22px; border-radius: 100px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .start-btn:hover { background: var(--accent); transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 242, 254, 0.4); }
    </style>
</head>
<body>
    <div class="panel">
        <div class="ping-radar">
            <div class="ping-box stc">STC <span id="p-stc">--</span></div>
            <div class="ping-box mobily">Mobily <span id="p-mobily">--</span></div>
            <div class="ping-box zain">Zain <span id="p-zain">--</span></div>
        </div>

        <div class="hero">
            <span style="color:var(--accent); font-weight: 900; letter-spacing: 5px;">GLOBAL NODE DOWNLOAD</span>
            <div id="v-dl" class="speed-num">0</div>
            <div style="font-size: 1.5rem; color: #444; font-weight: 900;">MBPS</div>
        </div>

        <div class="grid">
            <div class="card" id="c-idle">
                <span class="label">البينق المحلي (الأفضل)</span>
                <span id="v-idle" class="val">--</span><small>ms</small>
            </div>
            <div class="card" id="c-loaded">
                <span class="label">البينق المثقل (عالمي)</span>
                <span id="v-loaded" class="val">--</span><small>ms</small>
            </div>
            <div class="card" id="c-ul">
                <span class="label">الرفع (معدل)</span>
                <span id="v-ul" class="val">--</span><small>Mbps</small>
            </div>
        </div>

        <button class="start-btn" onclick="startHybridEngine()">بدء الفحص الهجين</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
