<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Elite V53 | Saudi Servers Edition</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #020308;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .master-panel {
            width: 850px; background: var(--glass); backdrop-filter: blur(50px);
            border-radius: 60px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        /* اختيار السيرفر */
        .server-box { margin-bottom: 25px; }
        .server-select {
            background: #111; color: var(--neon); border: 1px solid #333;
            padding: 10px 25px; border-radius: 100px; font-weight: bold; cursor: pointer;
        }

        /* العداد المصحح */
        .gauge-module { position: relative; width: 480px; height: 320px; margin: 0 auto; }
        .needle {
            position: absolute; bottom: 35px; left: 50%; width: 4px; height: 145px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon)); z-index: 5;
        }
        .pivot {
            position: absolute; bottom: 27px; left: 50%; width: 16px; height: 16px;
            background: var(--neon); border-radius: 50%; transform: translateX(-50%);
            box-shadow: 0 0 20px var(--neon); z-index: 6;
        }

        #speed-num { font-size: 6rem; font-weight: 950; display: block; margin-top: 190px; font-family: 'Arial Black'; line-height: 1; }
        .unit { color: #444; font-weight: 900; letter-spacing: 5px; font-size: 0.8rem; }

        /* الأزرار والنتائج */
        .btn-start {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: #fff; color: #000; font-weight: 950; cursor: pointer;
            margin: 20px 0; transition: 0.4s;
        }
        .btn-start:hover { transform: scale(1.1); background: var(--neon); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .card { background: rgba(255,255,255,0.01); padding: 25px; border-radius: 30px; border: 1px solid var(--border); }
        .card .v { font-size: 2rem; font-weight: 900; color: #fff; display: block; }
        .card .l { font-size: 0.65rem; color: #555; font-weight: 900; }
    </style>
</head>
<body>

<div class="master-panel">
    <div class="server-box">
        <select id="isp-node" class="server-select" onchange="manualNode()">
            <option value="auto">⚡ تحديد تلقائي للسيرفر الأسرع</option>
            <option value="stc">STC - الاتصالات السعودية</option>
            <option value="mobily">Mobily - موبايلي</option>
            <option value="zain">Zain - زين السعودية</option>
            <option value="salam">Salam - سلام (المتكاملة)</option>
            <option value="go">GO - عذيب للاتصالات</option>
            <option value="dawiyat">Dawiyat - ضوئيات</option>
        </select>
    </div>

    <div class="gauge-module">
        <svg viewBox="0 0 400 220" style="width:100%; height:100%;">
            <path d="M 50 190 A 150 150 0 0 1 350 190" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="12" font-weight="950" text-anchor="middle">
                <text x="50" y="210">0</text>
                <text x="65" y="130">100</text>
                <text x="125" y="75">200</text>
                <text x="200" y="55">300</text>
                <text x="275" y="75">400</text>
                <text x="350" y="210">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="pivot"></div>
        <span id="speed-num">0</span>
        <span class="unit">MBPS DOWNLOAD</span>
    </div>

    <button id="main-btn" class="btn-start" onclick="runV53()">بدء</button>

    <div class="stats-grid">
        <div class="card"><span class="l">IDLE PING (ms)</span><span id="v-ping" class="v">--</span></div>
        <div class="card"><span class="l">LOADED PING (ms)</span><span id="v-load" class="v">--</span></div>
        <div class="card"><span class="l">UPLOAD (Mbps)</span><span id="v-ul" class="v">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
