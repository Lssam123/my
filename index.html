<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V114 | GLASS ORB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora-bg"></div>
    
    <div class="glass-panel">
        
        <div class="header-row">
            <div class="status-dot"></div>
            <select id="server-list" class="clean-select">
                <option value="auto">⚡ تلقائي (الأسرع)</option>
                <option value="stc">STC Saudi Arabia</option>
                <option value="mobily">Mobily</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam</option>
                <option value="go">GO Telecom</option>
            </select>
        </div>

        <div class="orb-wrapper">
            <div class="orb-glow"></div>
            <svg class="progress-ring" width="260" height="260">
                <circle class="ring-bg" stroke-width="8" fill="transparent" r="120" cx="130" cy="130"/>
                <circle id="ring-progress" class="ring-fill" stroke-width="8" fill="transparent" r="120" cx="130" cy="130"/>
            </svg>
            <div class="orb-content">
                <div id="main-number">0</div>
                <div id="phase-label" class="phase-lbl">READY</div>
                <div class="unit-lbl">Mbps</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <span class="s-label">PING</span>
                <span id="val-ping" class="s-val">--</span>
            </div>
            <div class="stat-item">
                <span class="s-label">DOWNLOAD</span>
                <span id="val-dl" class="s-val text-blue">--</span>
            </div>
            <div class="stat-item">
                <span class="s-label">UPLOAD</span>
                <span id="val-ul" class="s-val text-purple">--</span>
            </div>
            <div class="stat-item">
                <span class="s-label">LOADED</span>
                <span id="val-jitter" class="s-val text-yellow">--</span>
            </div>
        </div>

        <div class="action-area">
            <button id="run-btn" class="glass-btn" onclick="startGlassTest()">START TEST</button>
            <button class="reset-icon" onclick="location.reload()">↺</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
