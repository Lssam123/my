<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V130 | PHANTOM</title>
    <style>
        /* --- تصميم الشبح V130 --- */
        :root { 
            --main-color: #00ff88; 
            --sec-color: #00ccff; 
            --bg-color: #050505; 
            --panel-color: #0f0f12; 
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-color); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        /* الخلفية الشبكية */
        .phantom-bg { 
            position: fixed; width: 100%; height: 100%; 
            background-image: linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px), 
            linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; z-index: -1;
        }

        .main-interface { 
            width: 95%; max-width: 450px; padding: 30px; 
            background: var(--panel-color); border: 1px solid #222; 
            border-radius: 25px; box-shadow: 0 0 100px rgba(0,0,0,0.9); 
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }

        /* شريط الحالة والسيرفر الخفي */
        .status-bar { 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px 20px; border-radius: 50px;
        }
        .connection-status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #888; }
        .pulse { width: 8px; height: 8px; background: var(--main-color); border-radius: 50%; box-shadow: 0 0 10px var(--main-color); animation: blink 2s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
        
        /* شريط الوقت */
        .timer-container { width: 100%; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
        .timer-fill { height: 100%; width: 0%; background: var(--main-color); transition: width 0.1s linear; }

        /* العداد */
        .gauge-zone { position: relative; width: 260px; height: 260px; margin: 0 auto; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-bg { stroke: #1a1a1a; stroke-width: 14; stroke-linecap: round; fill: none; }
        .track-fg { 
            stroke: var(--main-color); stroke-width: 14; stroke-linecap: round; fill: none;
            stroke-dasharray: 565; stroke-dashoffset: 565; /* الدائرة فارغة */
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
            filter: drop-shadow(0 0 10px var(--main-color));
        }

        .hud-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #speed-text { font-size: 4.5rem; font-weight: 800; line-height: 0.9; letter-spacing: -2px; }
        .unit { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .phase-label { font-size: 0.9rem; font-weight: bold; color: var(--main-color); margin-top: 5px; }

        /* منطقة البنق المثقل */
        .jitter-display { font-size: 0.9rem; color: #666; margin-top: -20px; margin-bottom: 10px; position: relative; z-index: 5; }
        .j-val { color: #ffd700; font-weight: bold; font-size: 1.1rem; margin-right: 5px; }

        /* شبكة النتائج */
        .grid-results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .card { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .c-lbl { font-size: 0.65rem; color: #666; font-weight: bold; margin-bottom: 3px; }
        .c-val { font-size: 1rem; font-weight: 900; direction: ltr; }

        /* الأزرار */
        .ctrl-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-main { 
            flex: 3; padding: 16px; border: none; border-radius: 12px;
            background: white; color: black; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; 
        }
        .btn-main:hover { background: var(--main-color); box-shadow: 0 0 30px var(--main-color); }
        .btn-main:disabled { background: #333; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .btn-reset { 
            flex: 1; border: 1px solid #333; background: transparent; border-radius: 12px;
            color: white; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .btn-reset:hover { border-color: var(--sec-color); color: var(--sec-color); }
    </style>
</head>
<body>
    <div class="phantom-bg"></div>
    <div class="main-interface">
        
        <div class="status-bar">
            <div class="connection-status">
                <div class="pulse"></div>
                <span id="server-status">جاهز للفحص</span>
            </div>
            <div id="timer-text" style="font-size: 0.8rem; font-weight: bold; color: #666">00s</div>
        </div>

        <div class="timer-container"><div id="time-bar" class="timer-fill"></div></div>

        <div class="gauge-zone">
            <svg viewBox="0 0 240 240">
                <path class="track-bg" d="M 40 200 A 100 100 0 1 1 200 200" />
                <path id="gauge-fill" class="track-fg" d="M 40 200 A 100 100 0 1 1 200 200" />
            </svg>
            <div class="hud-info">
                <div id="speed-text">0.0</div>
                <div class="unit">Mbps</div>
                <div id="phase-txt" class="phase-label">استعداد</div>
            </div>
        </div>

        <div class="jitter-display">
            استقرار الخط: <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="grid-results">
            <div class="card">
                <span class="c-lbl">PING</span>
                <span id="res-ping" class="c-val">--</span>
            </div>
            <div class="card">
                <span class="c-lbl">JITTER</span>
                <span id="res-jitter" class="c-val" style="color:#ffd700">--</span>
            </div>
            <div class="card">
                <span class="c-lbl">DOWN</span>
                <span id="res-dl" class="c-val" style="color:var(--main-color)">--</span>
            </div>
            <div class="card">
                <span class="c-lbl">UP</span>
                <span id="res-ul" class="c-val" style="color:var(--sec-color)">--</span>
            </div>
        </div>

        <div class="ctrl-btns">
            <button id="start-btn" class="btn-main" onclick="startPhantomTest()">بدء الفحص</button>
            <button class="btn-reset" onclick="resetAll()">↺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
