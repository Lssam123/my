<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محلل الشبكة الغربية V28 | جدة ومكة</title>
    <style>
        :root { --neon: #00f2fe; --bg: #040406; --card: #0c0c10; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .panel { width: 95%; max-width: 800px; background: var(--card); padding: 40px; border-radius: 40px; border: 1px solid #1a1a20; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.9); }
        
        .selector-box { background: #14141a; padding: 25px; border-radius: 30px; border: 2px solid #222; margin-bottom: 30px; }
        .srv-select { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 15px; border-radius: 50px; width: 100%; cursor: pointer; font-weight: 900; font-size: 1rem; }

        .main-display { display: flex; justify-content: space-around; align-items: center; margin: 40px 0; }
        .speed-unit { font-family: 'Consolas', monospace; }
        .big-num { font-size: 8rem; font-weight: 950; color: var(--neon); line-height: 1; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .stat-card { background: #111116; padding: 15px 5px; border-radius: 20px; border: 1px solid #1f1f25; }
        .stat-card.highlight { border-color: var(--neon); background: rgba(0, 242, 254, 0.03); }
        .val { font-size: 1.8rem; font-weight: 900; display: block; }
        .lbl { font-size: 0.65rem; color: #555; font-weight: 800; margin-bottom: 5px; }

        .btn-action { width: 100%; margin-top: 30px; background: #fff; color: #000; border: none; padding: 22px; border-radius: 100px; font-size: 1.5rem; font-weight: 950; cursor: pointer; transition: 0.3s; }
        .btn-action:disabled { background: #222; color: #444; }
        #status-text { margin-top: 15px; font-size: 0.8rem; color: #333; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="selector-box">
            <label style="color: #666; font-size: 0.8rem; margin-bottom: 10px; display: block;">سيرفرات المنطقة الغربية (جدة/مكة):</label>
            <select id="ping-node" class="srv-select" onchange="enableTest()">
                <option value="" disabled selected>-- اختر السيرفر المحلي للفحص --</option>
                <option value="https://www.uqu.edu.sa/favicon.ico">🕋 جامعة أم القرى - مكة المكرمة</option>
                <option value="https://www.kau.edu.sa/favicon.ico">🌊 جامعة الملك عبد العزيز - جدة</option>
                <option value="https://www.jeddah.gov.sa/favicon.ico">🏢 أمانة جدة - السيرفر الحكومي</option>
                <option value="https://www.stc.com.sa/favicon.ico">📶 STC - عقدة جدة الرئيسية</option>
            </select>
        </div>

        <div class="main-display">
            <div>
                <span id="dl-val" class="big-num">0</span>
                <div style="color:#222; font-weight:900;">DOWNLOAD Mbps</div>
            </div>
            <div>
                <span id="ul-val" class="big-num">0</span>
                <div style="color:#222; font-weight:900;">UPLOAD Mbps</div>
            </div>
        </div>

        <div class="grid">
            <div class="stat-card" id="s1">
                <span class="lbl">بينق (قبل)</span>
                <span id="v-ping1" class="val">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="s2">
                <span class="lbl">البينق المثقل</span>
                <span id="v-loaded" class="val">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="s3">
                <span class="lbl">بينق (بعد)</span>
                <span id="v-ping2" class="val">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="s4">
                <span class="lbl">التذبذب (Jitter)</span>
                <span id="v-jitter" class="val">--</span><small>ms</small>
            </div>
        </div>

        <button id="run-btn" class="btn-action" disabled onclick="masterEngine()">بدء فحص الدقة</button>
        <div id="status-text">System Ready</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
