<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedTest Elite | قياس السرعة الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --accent: #00d2ff; --bg: #060b19; --glass: rgba(255, 255, 255, 0.05); }
        body {
            background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: radial-gradient(circle at center, #111d35 0%, #060b19 100%);
        }
        .app-container {
            width: 90%; max-width: 500px; background: var(--glass); padding: 30px;
            border-radius: 30px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: center;
        }
        .main-gauge {
            width: 220px; height: 220px; border-radius: 50%; margin: 20px auto;
            border: 5px solid #1e293b; display: flex; flex-direction: column;
            justify-content: center; align-items: center; position: relative;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }
        .speed-number { font-size: 3.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
        .unit { color: #64748b; font-size: 1rem; margin-top: 5px; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .result-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; }
        .label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        .val { font-size: 1.2rem; font-weight: bold; color: white; }
        .go-btn {
            width: 100px; height: 100px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: #060b19; font-weight: bold; font-size: 1.2rem; cursor: pointer;
            margin-top: 20px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }
        .go-btn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0, 210, 255, 0.5); }
        .go-btn:disabled { opacity: 0.5; cursor: wait; }
        #chart-area { height: 120px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <h2>SpeedTest Elite</h2>
        <div class="main-gauge">
            <div id="display-speed" class="speed-number">0</div>
            <div class="unit">Mbps</div>
        </div>
        
        <button id="run-btn" class="go-btn">GO</button>

        <div class="results-grid">
            <div class="result-box"><div class="label">PING</div><div id="ping-val" class="val">--</div><small>ms</small></div>
            <div class="result-box"><div class="label">JITTER</div><div id="jitter-val" class="val">--</div><small>ms</small></div>
            <div class="result-box" style="grid-column: span 2;">
                <canvas id="miniChart"></canvas>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
