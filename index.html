<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Pro V49 | المصحح</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #030408;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .master-panel {
            width: 90%;
            max-width: 800px;
            background: var(--glass);
            backdrop-filter: blur(50px);
            border-radius: 50px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }

        .server-select {
            background: #111;
            color: var(--neon);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* العداد - تم فصل العناصر لمنع التداخل */
        .gauge-module {
            position: relative;
            width: 400px;
            height: 280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-svg {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        /* الإبرة - ضبط الارتكاز */
        .needle {
            position: absolute;
            bottom: 30px; /* نقطة المركز الفيزيائية للقوس */
            left: 50%;
            width: 4px;
            height: 130px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon));
            z-index: 5;
        }

        .pivot-point {
            position: absolute;
            bottom: 22px;
            left: 50%;
            width: 16px;
            height: 16px;
            background: var(--neon);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px var(--neon);
            z-index: 6;
        }

        .speed-readout {
            z-index: 10;
            margin-top: 150px;
        }

        #speed-num {
            font-size: 5.5rem;
            font-weight: 950;
            line-height: 1;
            font-family: 'Arial Black', sans-serif;
            color: #fff;
        }

        .speed-label {
            font-size: 0.8rem;
            color: #444;
            font-weight: 900;
            letter-spacing: 5px;
            margin-top: 5px;
        }

        .btn-start {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            margin: 20px 0;
        }

        .btn-start:hover { transform: scale(1.1); background: var(--neon); box-shadow: 0 0 30px var(--neon); }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255,255,255,0.01);
            padding: 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .card .v { font-size: 1.8rem; font-weight: 900; color: #fff; display: block; }
        .card .l { font-size: 0.65rem; color: #444; font-weight: 900; }

    </style>
</head>
<body>

<div class="master-panel">
    <select id="isp-selector" class="server-select" onchange="manualNode()">
        <option value="auto">⚡ تحديد تلقائي للسيرفر</option>
        <option value="stc">STC - الاتصالات السعودية</option>
        <option value="mobily">Mobily - موبايلي</option>
        <option value="zain">Zain - زين السعودية</option>
        <option value="salam">Salam - سلام</option>
        <option value="go">GO - عذيب</option>
        <option value="dawiyat">Dawiyat - ضوئيات</option>
    </select>

    <div class="gauge-module">
        <svg class="gauge-svg" viewBox="0 0 400 200">
            <path d="M 50 180 A 150 150 0 0 1 350 180" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="12" font-weight="950" text-anchor="middle">
                <text x="50" y="200">0</text>
                <text x="65" y="125">100</text>
                <text x="125" y="70">200</text>
                <text x="200" y="50">300</text>
                <text x="275" y="70">400</text>
                <text x="350" y="200">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="pivot-point"></div>
        <div class="speed-readout">
            <div id="speed-num">0</div>
            <div class="speed-label">DOWNLOAD MBPS</div>
        </div>
    </div>

    <button id="main-btn" class="btn-start" onclick="runV49()">بدء</button>

    <div class="stats-row">
        <div class="card"><span class="l">PING (ms)</span><span id="v-ping" class="v">--</span></div>
        <div class="card"><span class="l">JITTER (ms)</span><span id="v-jitter" class="v">--</span></div>
        <div class="card"><span class="l">UPLOAD (Mbps)</span><span id="v-ul" class="v">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
