<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل الشبكة الذكي | مشروع تخرج</title>
    <style>
        :root { --main: #00f2fe; --bg: #040810; --card: #111a2e; --active: #3b82f6; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 95%; max-width: 650px; background: var(--card); padding: 40px; border-radius: 45px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 50px 100px rgba(0,0,0,0.8); position: relative; }
        
        /* تأثير النبض البصري */
        .pulse-core { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; background: var(--main); filter: blur(130px); opacity: 0.1; z-index: 0; }

        .display-area { position: relative; z-index: 1; margin-bottom: 50px; text-align: center; }
        .label-top { font-size: 0.85rem; color: var(--main); font-weight: 800; letter-spacing: 4px; }
        .speed-digit { font-size: 8.5rem; font-weight: 900; background: linear-gradient(180deg, #fff 50%, var(--main) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.85; margin: 20px 0; }
        
        /* البطاقات الجانبية بنظام الشبكة */
        .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; position: relative; z-index: 1; }
        .stat-item { background: rgba(0,0,0,0.3); padding: 18px 10px; border-radius: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.03); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-item.active { border-color: var(--main); background: rgba(0, 242, 254, 0.08); transform: translateY(-8px); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1); }
        .stat-item span { display: block; }
        .stat-item .desc { font-size: 0.65rem; color: #64748b; margin-bottom: 8px; font-weight: 700; }
        .stat-item .num { font-size: 1.8rem; font-weight: 800; }
        .stat-item .unit { font-size: 0.65rem; color: #475569; }

        .action-box { margin-top: 45px; text-align: center; }
        .btn-start { background: #fff; color: #000; border: none; padding: 22px 85px; border-radius: 100px; font-size: 1.3rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-start:hover { background: var(--main); box-shadow: 0 0 40px rgba(0, 242, 254, 0.4); transform: scale(1.05); }
        .btn-start:disabled { opacity: 0.15; cursor: not-allowed; }
        
        #log { margin-top: 20px; font-size: 0.8rem; color: #475569; font-weight: 600; }
    </style>
</head>
<body>
    <div class="pulse-core"></div>
    <div class="container">
        <div class="display-area">
            <span class="label-top">استقبال البيانات</span>
            <div id="main-speed" class="speed-digit">0</div>
            <span style="color: #475569; font-weight: 900; font-size: 1rem;">Mbps</span>
        </div>

        <div class="grid-stats">
            <div class="stat-item" id="card-ping">
                <span class="desc">استجابة خاملة</span>
                <span id="v-ping" class="num">--</span><span class="unit">ملي ثانية</span>
            </div>
            <div class="stat-item" id="card-loaded">
                <span class="desc">استجابة مُثقلة</span>
                <span id="v-loaded" class="num">--</span><span class="unit">ملي ثانية</span>
            </div>
            <div class="stat-item" id="card-upload">
                <span class="desc">سرعة الإرسال</span>
                <span id="v-upload" class="num">--</span><span class="unit">Mbps</span>
            </div>
        </div>

        <div class="action-box">
            <button id="btn-run" class="btn-start" onclick="masterProcess()">ابدأ التحليل</button>
            <div id="log">جاهز للفحص العميق</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
