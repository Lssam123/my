<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المحلل السعودي V33 | Swift & Stable</title>
    <style>
        :root { --neon: #00f2fe; --bg: #030306; --panel: #0d0d12; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .master-panel { width: 92%; max-width: 850px; background: var(--panel); padding: 50px; border-radius: 55px; border: 1px solid #1a1a25; text-align: center; box-shadow: 0 60px 120px rgba(0,0,0,0.8); }
        
        .server-control { margin-bottom: 35px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .server-select { background: #15151b; color: var(--neon); border: 1px solid #222; padding: 12px 30px; border-radius: 100px; font-weight: 800; cursor: pointer; outline: none; transition: 0.3s; }
        .server-select:hover { border-color: var(--neon); }

        .hero-section { margin: 25px 0; }
        .main-speed { font-size: 11rem; font-weight: 950; color: var(--neon); line-height: 0.8; font-family: 'Arial Black', sans-serif; letter-spacing: -6px; }
        .unit-label { font-size: 1.4rem; color: #333; font-weight: 900; letter-spacing: 10px; margin-top: 15px; }

        .grid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 50px; }
        .stat-card { background: #09090e; padding: 25px 10px; border-radius: 35px; border: 1px solid #15151a; position: relative; overflow: hidden; }
        .stat-card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.03); }
        .stat-card .v { font-size: 2.8rem; font-weight: 950; display: block; color: #fff; }
        .stat-card .l { font-size: 0.7rem; color: #555; font-weight: 900; text-transform: uppercase; margin-bottom: 8px; }

        .btn-start { width: 100%; margin-top: 45px; background: #fff; color: #000; border: none; padding: 26px; border-radius: 100px; font-size: 1.7rem; font-weight: 950; cursor: pointer; transition: 0.4s; letter-spacing: 1px; }
        .btn-start:hover { background: var(--neon); transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0, 242, 254, 0.3); }
        #log-status { margin-top: 20px; font-size: 0.75rem; color: #222; font-weight: bold; }
    </style>
</head>
<body>
    <div class="master-panel">
        <div class="server-control">
            <label style="font-size: 0.7rem; color: #444; font-weight: 900;">سيرفر الفحص (Server Node)</label>
            <select id="isp-select" class="server-select" onchange="manualSelect()">
                <option value="auto">⚡ اختيار تلقائي (الأقل بينق)</option>
                <option value="stc">STC - الرياض</option>
                <option value="mobily">Mobily - جدة</option>
                <option value="zain">Zain - السعودية</option>
                <option value="salam">Salam - المتكاملة</option>
                <option value="go">GO - عذيب</option>
                <option value="dawiyat">Dawiyat - ضوئيات</option>
            </select>
        </div>

        <div class="hero-section">
            <div id="dl-val" class="main-speed">0</div>
            <div class="unit-label">Mbps DOWNLOAD</div>
        </div>

        <div class="grid-stats">
            <div class="stat-card" id="card-ping">
                <span class="l">البنق</span>
                <span id="v-ping" class="v">--</span>
            </div>
            <div class="stat-card" id="card-loaded">
                <span class="l">المثقل</span>
                <span id="v-loaded" class="v">--</span>
            </div>
            <div class="stat-card" id="card-ul">
                <span class="l">الرفع</span>
                <span id="v-ul" class="v">--</span>
            </div>
        </div>

        <button class="btn-start" onclick="igniteV33()">بدء فحص المعايرة</button>
        <div id="log-status">الرادار جاهز للمسح...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
