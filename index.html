<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V105 | STABILITY CORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quantum-bg"></div>
    
    <div class="main-deck">
        <div class="top-hud">
            <div class="hud-col">
                <span class="lbl">PING</span>
                <span id="fin-ping" class="val">-- <span class="unit">ms</span></span>
            </div>
            <div class="hud-col center-border">
                <span class="lbl">DOWNLOAD</span>
                <span id="fin-dl" class="val dl-txt">-- <span class="unit">Mbps</span></span>
            </div>
            <div class="hud-col">
                <span class="lbl">UPLOAD</span>
                <span id="fin-ul" class="val ul-txt">-- <span class="unit">Mbps</span></span>
            </div>
        </div>

        <div class="srv-box">
            <select id="srv-select" class="glass-dropdown">
                <option value="auto">🚀 تلقائي (أفضل استجابة)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
            </select>
        </div>

        <div class="gauge-module">
            <div class="ticks-circle" id="ticks"></div>
            <div class="gauge-body">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="g-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9FF"/><stop offset="1" stop-color="#92FE9D"/></linearGradient>
                        <linearGradient id="g-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F45C43"/><stop offset="1" stop-color="#EB3349"/></linearGradient>
                    </defs>
                    <path class="bg-path" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="active-path" class="fg-path" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#g-dl)" />
                </svg>
                <div id="needle" class="needle-main"></div>
            </div>
            <div class="center-info">
                <div id="live-num">0.0</div>
                <div id="phase-txt" class="phase-txt">READY</div>
                <div class="unit-sm">Mbps</div>
            </div>
        </div>

        <div class="jitter-panel">
            <div class="j-row">
                <span>البنق المثقل (Live Jitter)</span>
                <span id="live-jitter" class="j-val">--</span>
            </div>
            <div class="j-track"><div id="j-bar" class="j-fill"></div></div>
        </div>

        <button id="start-btn" class="power-btn" onclick="startV105()">START TEST</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
