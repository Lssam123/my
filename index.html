<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V104 | HOLOGRAPHIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="holo-bg"></div>
    <div class="glass-interface">
        
        <div class="hud-strip">
            <div class="hud-box">
                <span class="lbl">PING</span>
                <span id="val-ping" class="val">-- <small>ms</small></span>
            </div>
            <div class="hud-box">
                <span class="lbl">JITTER (LOADED)</span>
                <span id="val-jitter" class="val load-color">-- <small>ms</small></span>
            </div>
            <div class="hud-box">
                <span class="lbl">LOSS</span>
                <span id="val-loss" class="val">0 <small>%</small></span>
            </div>
        </div>

        <div class="server-nav">
            <select id="server-select" class="holo-select">
                <option value="auto">📡 الشبكة الذكية (Auto)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
            </select>
        </div>

        <div class="reactor-container">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-ring">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="grad-cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F260"/><stop offset="1" stop-color="#0575E6"/></linearGradient>
                        <linearGradient id="grad-magenta" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#833ab4"/><stop offset="1" stop-color="#fd1d1d"/></linearGradient>
                    </defs>
                    <path class="track-dim" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="track-main" class="track-lit" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#grad-cyan)" />
                </svg>
                <div id="needle" class="needle-laser"></div>
            </div>
            
            <div class="center-data">
                <div id="big-speed">0</div>
                <div id="status-text" class="status-text">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="results-dock">
            <div class="res-pill">
                <span>DOWNLOAD</span>
                <b id="final-dl" class="cyan">--</b>
            </div>
            <div class="res-pill">
                <span>UPLOAD</span>
                <b id="final-ul" class="magenta">--</b>
            </div>
        </div>

        <button id="start-btn" class="holo-btn" onclick="startHoloTest()">ابدأ الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
