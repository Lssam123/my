<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Analyzer Pro | نظام الفحص الزمني</title>
    <style>
        :root { --accent: #00f2fe; --bg: #080c15; --card: #111827; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 800px; background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .main-display { text-align: center; margin-bottom: 40px; }
        .speed-val { font-size: 6rem; font-weight: 900; color: var(--accent); line-height: 1; }
        .unit { font-size: 1.2rem; color: #4b5563; }
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-card { background: rgba(255,255,255,0.02); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .label { display: block; font-size: 0.8rem; color: #9ca3af; margin-bottom: 10px; font-weight: bold; }
        .number { font-size: 2rem; font-weight: bold; color: #f3f4f6; }
        .active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
        .btn-go { width: 100%; padding: 20px; margin-top: 30px; border-radius: 15px; border: none; background: linear-gradient(90deg, #00f2fe, #4facfe); color: #080c15; font-weight: 900; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .btn-go:disabled { filter: grayscale(1); cursor: not-allowed; }
        #status { text-align: center; margin-top: 15px; color: var(--accent); font-size: 0.9rem; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-display">
            <div id="big-speed" class="speed-val">0</div>
            <div class="unit">Mbps</div>
        </div>

        <div class="results-grid">
            <div class="stat-card" id="card-ping">
                <span class="label">PING (خامل)</span>
                <span id="res-ping" class="number">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="card-loaded">
                <span class="label">PING (مُثقل)</span>
                <span id="res-loaded" class="number">--</span><small>ms</small>
            </div>
            <div class="stat-card" id="card-dl">
                <span class="label">DOWNLOAD</span>
                <span id="res-dl" class="number">--</span><small>Mbps</small>
            </div>
            <div class="stat-card" id="card-ul">
                <span class="label">UPLOAD</span>
                <span id="res-ul" class="number">--</span><small>Mbps</small>
            </div>
        </div>

        <button id="start-btn" class="btn-go" onclick="runProfessionalTest()">ابدأ الفحص المتقدم</button>
        <div id="status">جاهز للاختبار</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
