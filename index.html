<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-Speed Elite V52 | التحليل المتزامن</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #010206;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; overflow: hidden;
        }

        .main-panel {
            width: 850px; background: var(--glass); backdrop-filter: blur(40px);
            border-radius: 50px; padding: 40px; border: 1px solid var(--border); text-align: center;
        }

        /* العداد */
        .gauge-container { position: relative; width: 450px; height: 300px; margin: 0 auto; }
        .needle {
            position: absolute; bottom: 30px; left: 50%; width: 4px; height: 140px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center; transform: translateX(-50%) rotate(-90deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon)); z-index: 5;
        }

        #dl-speed { font-size: 6.5rem; font-weight: 950; font-family: 'Arial Black'; line-height: 1; margin-top: 170px; display: block; }
        .unit-lbl { color: #444; font-weight: 900; letter-spacing: 5px; font-size: 0.8rem; }

        /* البطاقات */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .card { background: rgba(255,255,255,0.01); padding: 25px; border-radius: 30px; border: 1px solid var(--border); transition: 0.4s; }
        .card.active { border-color: var(--neon); box-shadow: 0 0 20px rgba(0, 242, 254, 0.15); }
        .card .v { font-size: 2.2rem; font-weight: 950; display: block; color: #fff; }
        .card .l { font-size: 0.7rem; color: #555; font-weight: 900; }

        .btn-start {
            width: 90px; height: 90px; border-radius: 50%; background: #fff; color: #000;
            border: none; font-size: 1.2rem; font-weight: 900; cursor: pointer;
            margin-top: 20px; transition: 0.4s;
        }
        .btn-start:hover { transform: scale(1.1); background: var(--neon); }
    </style>
</head>
<body>

<div class="main-panel">
    <div class="gauge-container">
        <svg viewBox="0 0 400 210" style="width:100%; height:100%;">
            <path d="M 50 190 A 150 150 0 0 1 350 190" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#222" font-size="12" font-weight="900" text-anchor="middle">
                <text x="50" y="208">0</text><text x="125" y="70">200</text><text x="275" y="70">400</text><text x="350" y="208">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <span id="dl-speed">0</span>
        <span class="unit-lbl">DOWNLOAD MBPS</span>
    </div>

    <button class="btn-start" onclick="runV52()">بدء</button>

    <div class="stats-grid">
        <div class="card" id="ping-card"><span class="l">البنق الخامل</span><span id="res-ping" class="v">--</span></div>
        <div class="card" id="load-card"><span class="l">البنق المثقل (تحت الضغط)</span><span id="res-load" class="v">--</span></div>
        <div class="card" id="ul-card"><span class="l">الرفع (Upload)</span><span id="res-ul" class="v">--</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
