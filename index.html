<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V45 | 500 Mbps Edition</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #030408;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-panel {
            width: 850px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border-radius: 50px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
        }

        /* حاوية العداد المصححة */
        .gauge-wrapper {
            position: relative;
            width: 450px;
            height: 300px;
            margin: 0 auto;
        }

        .gauge-svg {
            width: 100%;
            height: 100%;
        }

        /* الإبرة المصححة */
        .needle {
            position: absolute;
            bottom: 20px; /* نقطة الارتكاز */
            left: 50%;
            width: 4px;
            height: 140px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(-90deg); /* تبدأ من الصفر */
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 8px var(--neon));
            z-index: 5;
        }

        .pivot {
            position: absolute;
            bottom: 12px;
            left: 50%;
            width: 16px;
            height: 16px;
            background: var(--neon);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 15px var(--neon);
            z-index: 6;
        }

        /* أرقام السرعة */
        .speed-display {
            margin-top: -30px;
        }

        #dl-speed {
            font-size: 6rem;
            font-weight: 900;
            color: #fff;
            line-height: 0.8;
            font-family: 'Arial Black', sans-serif;
        }

        .unit-text {
            color: #444;
            font-weight: 900;
            letter-spacing: 5px;
            font-size: 0.9rem;
            margin-top: 10px;
            display: block;
        }

        /* الأزرار والتحكم */
        .controls { margin-bottom: 20px; }
        .server-select {
            background: #111;
            color: var(--neon);
            border: 1px solid #222;
            padding: 10px 25px;
            border-radius: 100px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #fff;
            color: #000;
            border: none;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.4s;
        }

        .btn-start:hover { transform: scale(1.1); background: var(--neon); box-shadow: 0 0 30px var(--neon); }
        .btn-start:disabled { opacity: 0.1; }

        /* البطاقات الإحصائية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: rgba(255,255,255,0.01);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .card .lbl { font-size: 0.7rem; color: #555; display: block; margin-bottom: 5px; font-weight: 900; }
        .card .val { font-size: 2rem; font-weight: 900; color: #fff; }

    </style>
</head>
<body>

<div class="main-panel">
    <div class="controls">
        <select id="server-select" class="server-select" onchange="manualNode()">
            <option value="auto">⚡ اختيار تلقائي ذكي</option>
            <option value="stc">STC</option>
            <option value="mobily">Mobily</option>
            <option value="zain">Zain</option>
            <option value="salam">Salam</option>
            <option value="go">GO (Atheeb)</option>
            <option value="dawiyat">Dawiyat</option>
        </select>
    </div>

    <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 400 200">
            <path d="M 50 180 A 150 150 0 0 1 350 180" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            
            <g fill="#444" font-size="12" font-weight="900" text-anchor="middle">
                <text x="50" y="198">0</text>
                <text x="65" y="120">100</text>
                <text x="125" y="65">200</text>
                <text x="200" y="45">300</text>
                <text x="275" y="65">400</text>
                <text x="350" y="198">500</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="pivot"></div>
    </div>

    <div class="speed-display">
        <div id="dl-speed">0</div>
        <span class="unit-text">Mbps DOWNLOAD</span>
    </div>

    <button id="start-btn" class="btn-start" onclick="runV45()">بدء</button>

    <div class="stats-grid">
        <div class="card">
            <span class="lbl">البنق (ms)</span>
            <span id="v-ping" class="val">--</span>
        </div>
        <div class="card">
            <span class="lbl">المثقل (ms)</span>
            <span id="v-loaded" class="val">--</span>
        </div>
        <div class="card">
            <span class="lbl">الرفع (Mbps)</span>
            <span id="v-ul" class="val">--</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
