<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V116 | INFINITY SWARM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="infinity-bg"></div>
    <div class="swarm-container">
        
        <div class="status-deck">
            <div class="stat-pod">
                <span class="lbl">PING</span>
                <span id="res-ping" class="val">-- <small>ms</small></span>
            </div>
            <div class="stat-pod middle">
                <span class="lbl">DOWNLOAD</span>
                <span id="res-dl" class="val neon-blue">-- <small>Mbps</small></span>
            </div>
            <div class="stat-pod">
                <span class="lbl">UPLOAD</span>
                <span id="res-ul" class="val neon-pink">-- <small>Mbps</small></span>
            </div>
        </div>

        <div class="server-hub">
            <select id="srv-select" class="swarm-select">
                <option value="auto">⚡ SWARM AUTO (أقصى سرعة)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
            </select>
        </div>

        <div class="gauge-infinity">
            <canvas id="gauge-canvas" width="300" height="300"></canvas>
            
            <div class="center-hud">
                <div id="live-num">0.0</div>
                <div id="phase-txt" class="phase-txt">SYSTEM READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="net-info">
            <div class="info-row">
                <span>Loaded Jitter</span>
                <strong id="val-jitter" class="yellow">-- ms</strong>
            </div>
            <div class="info-row">
                <span>Swarm Threads</span>
                <strong id="thread-count" class="green">0 / 50</strong>
            </div>
            <div class="stability-track">
                <div id="stability-bar" class="stability-fill"></div>
            </div>
        </div>

        <button id="start-btn" class="swarm-btn" onclick="startSwarmTest()">ACTIVATE SWARM</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
