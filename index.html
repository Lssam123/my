<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محلل الشبكة الفائق | النسخة الاحترافية V8</title>
    <style>
        :root { --neon-blue: #00f2fe; --deep-bg: #010409; --card-glass: rgba(13, 20, 33, 0.95); }
        body { background: var(--deep-bg); color: #fff; font-family: 'Segoe UI', system-ui; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .main-frame { width: 90%; max-width: 750px; background: var(--card-glass); padding: 60px; border-radius: 60px; border: 1px solid rgba(0, 242, 254, 0.1); box-shadow: 0 0 100px rgba(0,0,0,1); position: relative; backdrop-filter: blur(20px); }
        
        .pulse-light { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 400px; height: 400px; background: radial-gradient(circle, var(--neon-blue) 0%, transparent 75%); filter: blur(120px); opacity: 0.08; z-index: 0; pointer-events: none; }

        .gauge-section { position: relative; z-index: 1; margin-bottom: 60px; text-align: center; }
        .label-top { font-size: 0.8rem; color: var(--neon-blue); font-weight: 900; letter-spacing: 8px; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        .big-speed { font-size: 10rem; font-weight: 950; background: linear-gradient(180deg, #fff 50%, var(--neon-blue) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 0.8; margin: 30px 0; font-family: 'Courier New', monospace; }
        
        .grid-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; position: relative; z-index: 1; }
        .stat-box { background: rgba(255,255,255,0.02); padding: 25px 15px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .stat-box.active { border-color: var(--neon-blue); background: rgba(0, 242, 254, 0.04); transform: translateY(-15px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .box-title { display: block; font-size: 0.7rem; color: #586069; margin-bottom: 12px; font-weight: 800; }
        .box-val { font-size: 2.2rem; font-weight: 900; color: #f0f6fc; }
        .box-unit { font-size: 0.7rem; color: #484f58; margin-right: 4px; }

        .btn-launch { margin-top: 60px; background: #fff; color: #010409; border: none; padding: 24px 100px; border-radius: 100px; font-size: 1.5rem; font-weight: 950; cursor: pointer; transition: 0.4s; box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .btn-launch:hover { background: var(--neon-blue); transform: scale(1.08); box-shadow: 0 0 50px rgba(0, 242, 254, 0.4); }
        .btn-launch:disabled { opacity: 0.03; filter: grayscale(1); cursor: wait; }
        
        #engine-status { margin-top: 30px; font-size: 0.85rem; color: #484f58; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="pulse-light"></div>
    <div class="main-frame">
        <div class="gauge-section">
            <span class="label-top">تحميل البيانات المستمر</span>
            <div id="hero-speed" class="big-speed">0</div>
            <div style="color: #484f58; font-weight: 900; font-size: 1.2rem;">Mbps</div>
        </div>

        <div class="grid-results">
            <div class="stat-box" id="b-ping">
                <span class="box-title">استجابة خاملة</span>
                <span id="v-ping" class="box-val">--</span><span class="box-unit">MS</span>
            </div>
            <div class="stat-box" id="b-loaded">
                <span class="box-title">استجابة مُثقلة</span>
                <span id="v-loaded" class="box-val">--</span><span class="box-unit">MS</span>
            </div>
            <div class="stat-box" id="b-upload">
                <span class="box-title">سرعة الرفع</span>
                <span id="v-upload" class="box-val">--</span><span class="box-unit">Mbps</span>
            </div>
        </div>

        <div style="text-align: center;">
            <button id="run-btn" class="btn-launch" onclick="initiateHighPrecisionTest()">تشغيل المحرك</button>
            <div id="engine-status">جاهز للمعايرة الإحصائية</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
