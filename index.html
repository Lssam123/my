<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V143 | REALISTIC</title>
    <style>
        /* --- تصميم الواقعية V143 --- */
        :root { 
            --main-col: #00bcd4; /* سماوي هادئ */
            --ul-col: #e91e63;   /* وردي */
            --bg-col: #121212; 
            --panel: #1e1e1e;
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg-col); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .realistic-bg { 
            position: fixed; width: 100%; height: 100%; 
            background: linear-gradient(to bottom, #1a1a1a, #000); z-index: -1;
        }

        .console { 
            width: 95%; max-width: 450px; padding: 25px; 
            background: var(--panel); border: 1px solid #333; 
            border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            text-align: center; display: flex; flex-direction: column; gap: 20px;
        }

        /* شريط الحالة */
        .status-bar { 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 8px;
            font-size: 0.8rem; color: #888;
        }
        
        /* شريط الوقت */
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: white; transition: width 0.1s linear; }

        /* العداد (للتحميل فقط) */
        .gauge-section { position: relative; width: 260px; height: 260px; margin: 0 auto; transition: opacity 0.3s; }
        svg { transform: rotate(135deg); width: 100%; height: 100%; }
        
        .track-base { stroke: #2a2a2a; stroke-width: 12; stroke-linecap: butt; fill: none; }
        .track-fill { 
            stroke: var(--main-col); stroke-width: 12; stroke-linecap: butt; fill: none;
            stroke-dasharray: 615; stroke-dashoffset: 615; 
            transition: stroke-dashoffset 0.1s linear;
        }

        .center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #speed-display { font-size: 4.5rem; font-weight: 800; line-height: 0.9; letter-spacing: -2px; }
        .unit-lbl { font-size: 0.8rem; color: #666; margin-top: 5px; }
        .phase-lbl { font-size: 0.9rem; font-weight: bold; color: var(--main-col); margin-top: 5px; }

        /* منطقة الجيتر */
        .jitter-area { margin-top: -20px; font-size: 0.85rem; color: #666; position: relative; z-index: 5; }
        .j-val { color: #ff9800; font-weight: bold; }

        /* البطاقات */
        .cards-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { 
            background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; 
            display: flex; flex-direction: column; border: 1px solid transparent;
        }
        .head { font-size: 0.7rem; color: #666; font-weight: bold; margin-bottom: 5px; }
        .val { font-size: 1.1rem; font-weight: 900; direction: ltr; }

        /* تمييز بطاقة الرفع */
        .upload-active { 
            border-color: var(--ul-col); background: rgba(233, 30, 99, 0.05); 
            box-shadow: 0 0 15px rgba(233, 30, 99, 0.1);
        }
        .dimmed { opacity: 0.15; filter: grayscale(100%); }

        /* الأزرار */
        .btn-main { 
            width: 100%; padding: 16px; border: none; border-radius: 8px; margin-top: 10px;
            background: white; color: black; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; transition: 0.2s; 
        }
        .btn-main:hover { background: var(--main-col); }
        .btn-main:disabled { background: #333; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="realistic-bg"></div>
    <div class="console">
        
        <div class="status-bar">
            <span id="srv-name">تلقائي (KSA)</span>
            <span id="time-txt">0.0s</span>
        </div>

        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>

        <div id="main-gauge" class="gauge-section">
            <svg viewBox="0 0 260 260">
                <path class="track-base" d="M 50 210 A 110 110 0 1 1 210 210" />
                <path id="track-fill" class="track-fill" d="M 50 210 A 110 110 0 1 1 210 210" />
            </svg>
            <div class="center-text">
                <div id="speed-display">0.0</div>
                <div class="unit-lbl">Mbps (تنزيل)</div>
                <div id="phase-txt" class="phase-lbl">جاهز</div>
            </div>
        </div>

        <div class="jitter-area">
            استقرار الخط: <span id="live-jitter" class="j-val">--</span>
        </div>

        <div class="cards-row">
            <div class="card">
                <span class="head">PING</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div id="card-ul" class="card">
                <span class="head">UPLOAD</span>
                <span id="res-ul" class="val" style="color:var(--ul-col)">--</span>
            </div>
            <div class="card">
                <span class="head">JITTER</span>
                <span id="res-jitter" class="val" style="color:#ff9800">--</span>
            </div>
        </div>

        <button id="start-btn" class="btn-main" onclick="startRealisticTest()">بدء الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
