<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرك قياس الشبكة المطور | Professional Edition</title>
    <style>
        :root { --accent: #00f2fe; --bg: #0a0a0c; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .main-container { width: 90%; max-width: 800px; background: #121214; padding: 40px; border-radius: 40px; border: 1px solid #222; text-align: center; }
        
        .speed-box { margin-bottom: 40px; }
        .speed-value { font-size: 10rem; font-weight: 950; background: linear-gradient(180deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: #1a1a1c; padding: 20px; border-radius: 20px; border: 1px solid #222; }
        .card.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,242,254,0.15); }
        .card span { display: block; }
        .label { font-size: 0.75rem; color: #666; font-weight: bold; margin-bottom: 8px; }
        .num { font-size: 2rem; font-weight: 900; }

        .go-btn { width: 100%; margin-top: 30px; background: #fff; color: #000; border: none; padding: 20px; border-radius: 100px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .go-btn:hover { background: var(--accent); transform: scale(1.02); }
        #status-msg { margin-top: 15px; font-size: 0.8rem; color: #444; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="speed-box">
            <span style="color:var(--accent); font-weight: 900; letter-spacing: 5px;">DOWNLOAD</span>
            <div id="dl-text" class="speed-value">0</div>
            <div style="font-weight: 900; color: #444; font-size: 1.5rem; margin-top: -10px;">Mbps</div>
        </div>

        <div class="metrics">
            <div class="card" id="c-idle">
                <span class="label">البينق (استجابة خاملة)</span>
                <span id="v-idle" class="num">--</span><small>ms</small>
            </div>
            <div class="card" id="c-loaded">
                <span class="label">البينق (تحت الضغط)</span>
                <span id="v-loaded" class="num">--</span><small>ms</small>
            </div>
            <div class="card" id="c-ul">
                <span class="label">الرفع (إرسال)</span>
                <span id="v-ul" class="num">--</span><small>Mbps</small>
            </div>
        </div>

        <button class="go-btn" onclick="startV16Engine()">بدء المعايرة الفنية</button>
        <div id="status-msg">نظام الفحص جاهز | بروتوكول Anycast نشط</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
