<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل الشبكة الاحترافي | V6.0</title>
    <style>
        :root { --main-glow: #00f2fe; --bg: #04070f; --card-bg: #0d121f; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .main-container { width: 90%; max-width: 650px; background: var(--card-bg); padding: 50px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 50px 100px rgba(0,0,0,0.8); position: relative; }
        
        /* توهج ديناميكي خلف العداد */
        .aura { position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 280px; background: var(--main-glow); filter: blur(140px); opacity: 0.1; z-index: 0; transition: 0.5s; }

        .hero-display { position: relative; z-index: 1; margin-bottom: 60px; text-align: center; }
        .hero-title { font-size: 0.8rem; color: var(--main-glow); font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }
        .main-number { font-size: 8.5rem; font-weight: 900; background: linear-gradient(180deg, #fff 40%, var(--main-glow) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin: 20px 0; font-variant-numeric: tabular-nums; }
        
        /* البطاقات الجانبية المصغرة جداً */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; z-index: 1; position: relative; }
        .mini-stat { background: rgba(0,0,0,0.3); padding: 15px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .mini-stat.active { border-color: var(--main-glow); background: rgba(0, 242, 254, 0.1); transform: scale(1.05); }
        .mini-stat .tag { font-size: 0.65rem; color: #64748b; display: block; margin-bottom: 8px; font-weight: 700; }
        .mini-stat .val { font-size: 1.8rem; font-weight: 800; color: #fff; }
        .mini-stat .unit { font-size: 0.6rem; color: #475569; margin-right: 2px; }

        /* التحكم والحالة */
        .action-area { margin-top: 50px; text-align: center; }
        .btn-launch { background: #fff; color: #000; border: none; padding: 22px 80px; border-radius: 100px; font-size: 1.3rem; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 40px rgba(255,255,255,0.1); }
        .btn-launch:hover { background: var(--main-glow); box-shadow: 0 0 50px rgba(0, 242, 254, 0.5); transform: translateY(-5px); }
        .btn-launch:disabled { opacity: 0.1; cursor: wait; }
        
        #status-msg { margin-top: 25px; font-size: 0.8rem; color: #475569; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="aura" id="aura"></div>
    <div class="main-container">
        <div class="hero-display">
            <span class="hero-title">سرعة التحميل اللحظية</span>
            <div id="main-val" class="main-number">0</div>
            <span style="color: #475569; font-weight: 800;">Mbps</span>
        </div>

        <div class="stats-grid">
            <div class="mini-stat" id="box-ping">
                <span class="tag">بينق خامل</span>
                <span id="v-ping" class="val">--</span><span class="unit">MS</span>
            </div>
            <div class="mini-stat" id="box-loaded">
                <span class="tag">بينق مُثقل</span>
                <span id="v-loaded" class="val">--</span><span class="unit">MS</span>
            </div>
            <div class="mini-stat" id="box-upload">
                <span class="tag">سرعة الرفع</span>
                <span id="v-upload" class="val">--</span><span class="unit">Mbps</span>
            </div>
        </div>

        <div class="action-area">
            <button id="launch-btn" class="btn-launch" onclick="runEngine()">بدء التحليل</button>
            <div id="status-msg">نظام المعايرة جاهز</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
