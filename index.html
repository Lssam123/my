<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V124 | CHRONO SYNC</title>
    <style>
        /* --- V124 Design System --- */
        :root { --dl-color: #00F260; --ul-color: #F000FF; --jit-color: #FFD700; --bg: #09090b; --glass: rgba(25, 25, 30, 0.95); }
        body { background: var(--bg); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        .sync-bg { 
            position: fixed; width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 10%, #1a202c 0%, #000 100%); z-index: -1;
        }

        .main-console { 
            width: 95%; max-width: 480px; padding: 25px; 
            background: var(--glass); border: 1px solid #333; 
            border-radius: 24px; box-shadow: 0 0 80px rgba(0,0,0,0.8); 
            text-align: center; position: relative;
        }

        /* شريط الوقت */
        .time-track { width: 100%; height: 4px; background: #222; border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
        .time-fill { height: 100%; width: 0%; background: white; transition: width 0.1s linear; }

        /* النتائج */
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; }
        .stat-item { flex: 1; display: flex; flex-direction: column; position: relative; }
        .sep { border-left: 1px solid #333; border-right: 1px solid #333; }
        .lbl { font-size: 0.65rem; color: #777; font-weight: bold; letter-spacing: 1px; }
        .val { font-size: 1.1rem; font-weight: 900; margin-top: 5px; }
        
        /* ألوان */
        .c-dl { color: var(--dl-color); } .c-ul { color: var(--ul-color); } .c-jit { color: var(--jit-color); }

        .server-select { 
            width: 100%; background: #000; color: white; border: 1px solid #444; 
            padding: 12px; border-radius: 10px; font-weight: bold; outline: none; margin-bottom: 20px; 
        }

        /* العداد */
        .gauge-area { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        .track-bg { stroke: #222; stroke-width: 14; stroke-linecap: round; }
        .track-fg { 
            stroke-width: 14; stroke-linecap: round; 
            stroke-dasharray: 600; stroke-dashoffset: 600; 
            transition: stroke-dashoffset 0.1s linear; 
            filter: drop-shadow(0 0 10px var(--dl-color)); 
        }

        .center-hud { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        #live-num { font-size: 5rem; font-weight: 900; line-height: 0.9; letter-spacing: -3px; }
        .status-txt { font-size: 0.8rem; font-weight: bold; color: #666; margin-top: 5px; text-transform: uppercase; }

        /* منطقة الجيتر (أسفل العداد) */
        .jitter-dock { 
            margin-top: -30px; margin-bottom: 20px; position: relative; z-index: 10;
            background: rgba(0,0,0,0.5); padding: 8px 20px; border-radius: 20px; 
            display: inline-block; border: 1px solid #333;
        }
        .j-lbl { font-size: 0.7rem; color: #888; margin-right: 5px; }
        .j-val { font-size: 1.1rem; font-weight: 900; color: var(--jit-color); }

        /* الأزرار */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .main-btn { 
            flex: 4; padding: 16px; background: white; border: none; border-radius: 12px;
            color: black; font-weight: 900; font-size: 1.1rem; cursor: pointer; transition: 0.3s; 
        }
        .main-btn:hover { background: var(--dl-color); box-shadow: 0 0 25px var(--dl-color); }
        .main-btn:disabled { background: #333; color: #555; box-shadow: none; cursor: not-allowed; }
        
        .reset-btn { flex: 1; background: #222; border: 1px solid #444; border-radius: 12px; color: white; font-size: 1.4rem; cursor: pointer; }
        .reset-btn:hover { border-color: var(--ul-color); color: var(--ul-color); }
    </style>
</head>
<body>
    <div class="sync-bg"></div>
    <div class="main-console">
        
        <div class="time-track"><div id="time-bar" class="time-fill"></div></div>

        <div class="stats-row">
            <div class="stat-item">
                <span class="lbl">PING</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div class="stat-item sep">
                <span class="lbl">DOWNLOAD</span>
                <span id="res-dl" class="val c-dl">--</span>
            </div>
            <div class="stat-item">
                <span class="lbl">UPLOAD</span>
                <span id="res-ul" class="val c-ul">--</span>
            </div>
        </div>

        <select id="srv-select" class="server-select">
            <option value="auto">📡 تلقائي (الأفضل)</option>
            <optgroup label="Saudi Arabia Servers">
                <option value="stc">STC (الاتصالات)</option>
                <option value="mobily">Mobily (موبايلي)</option>
                <option value="zain">Zain (زين)</option>
                <option value="salam">Salam (سلام)</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat</option>
            </optgroup>
        </select>

        <div class="gauge-area">
            <svg viewBox="0 0 300 300">
                <defs>
                    <linearGradient id="g-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F260"/><stop offset="1" stop-color="#0575E6"/></linearGradient>
                    <linearGradient id="g-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F000FF"/><stop offset="1" stop-color="#FF5E00"/></linearGradient>
                </defs>
                <path class="track-bg" d="M 60 260 A 130 130 0 1 1 240 260" fill="none" />
                <path id="track-fill" class="track-fg" d="M 60 260 A 130 130 0 1 1 240 260" fill="none" stroke="url(#g-dl)" />
            </svg>
            <div class="center-hud">
                <div id="live-num">0.0</div>
                <div id="status-txt" class="status-txt">READY</div>
            </div>
        </div>

        <div class="jitter-dock">
            <span class="j-lbl">LOADED JITTER:</span>
            <span id="res-jitter" class="j-val">-- ms</span>
        </div>

        <div class="btn-group">
            <button id="start-btn" class="main-btn" onclick="runSyncTest()">START TEST</button>
            <button class="reset-btn" onclick="resetAll()">↺</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
