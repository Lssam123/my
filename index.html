<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-SPEED V69 | التدفق السريع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="master-hub">
        <div class="server-control">
            <div class="select-wrapper">
                <label>اختيار السيرفر (Node Selection)</label>
                <select id="server-selector" class="modern-select">
                    <option value="auto">⚡ AUTO RADAR (أسرع بنق)</option>
                    <option value="stc">STC</option>
                    <option value="mobily">Mobily</option>
                    <option value="zain">Zain</option>
                    <option value="salam">Salam</option>
                    <option value="go">GO</option>
                    <option value="dawiyat">Dawiyat</option>
                </select>
            </div>
        </div>

        <div class="gauge-world">
            <div class="gauge-ticks">
                <span class="tick" style="--angle: -120deg;">0</span>
                <span class="tick" style="--angle: -72deg;">100</span>
                <span class="tick" style="--angle: -24deg;">200</span>
                <span class="tick" style="--angle: 24deg;">300</span>
                <span class="tick" style="--angle: 72deg;">400</span>
                <span class="tick" style="--angle: 120deg;">500</span>
            </div>
            <div class="turbine-wrap">
                <svg class="main-gauge" viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                </svg>
                <div id="needle" class="digital-needle"></div>
            </div>
            <div class="center-display">
                <div id="main-speed">0</div>
                <div id="mode-text" class="status-lbl">جاهز</div>
                <div class="mbps-unit">ميجابت/ث</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card">
                <span class="lbl">البنق الخامل (5 ث)</span>
                <span id="res-ping" class="val">--</span>
            </div>
            <div class="res-card active-pulse">
                <span class="lbl">البنق المثقل (15 ث)</span>
                <span id="res-load" class="val">--</span>
            </div>
            <div class="res-card">
                <span class="lbl">سرعة الرفع (15 ث)</span>
                <span id="res-ul" class="val">--</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startV69()">ابدأ الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
