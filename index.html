<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محاكي سبيد تست المطور V30</title>
    <style>
        :root { --accent: #00f2fe; --bg: #050508; --panel: #0d0d12; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .test-box { width: 90%; max-width: 800px; background: var(--panel); padding: 40px; border-radius: 50px; border: 1px solid #1f1f2a; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
        .server-info { margin-bottom: 25px; font-weight: 800; color: #555; font-size: 0.85rem; }
        .server-select { background: #16161d; color: var(--accent); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; outline: none; cursor: pointer; }
        .main-speed { font-size: 11rem; font-weight: 950; color: var(--accent); line-height: 0.8; font-family: 'Arial Black', sans-serif; letter-spacing: -6px; margin: 20px 0; }
        .unit { font-size: 1.5rem; color: #222; font-weight: 900; letter-spacing: 5px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
        .card { background: #111116; padding: 25px 15px; border-radius: 30px; border: 1px solid #1a1a20; }
        .card .val { font-size: 2.6rem; font-weight: 900; display: block; color: #fff; }
        .card .lbl { font-size: 0.7rem; color: #444; font-weight: 900; text-transform: uppercase; }
        .btn-go { width: 100%; margin-top: 40px; background: #fff; color: #000; border: none; padding: 25px; border-radius: 100px; font-size: 1.8rem; font-weight: 950; cursor: pointer; transition: 0.4s; }
        .btn-go:hover { background: var(--accent); transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 242, 254, 0.4); }
        .btn-go:disabled { opacity: 0.1; }
    </style>
</head>
<body>
    <div class="test-box">
        <div class="server-info">
            سيرفر الفحص: 
            <select id="server-list" class="server-select" onchange="switchServer()">
                <option value="auto">تحديد آلي (الأقرب)</option>
                <option value="stc">STC - الرياض</option>
                <option value="mobily">Mobily - جدة</option>
                <option value="zain">Zain - السعودية</option>
                <option value="salam">Salam - المتكاملة</option>
                <option value="go">GO - عذيب</option>
            </select>
        </div>
        <div id="main-val" class="main-speed">0</div>
        <div class="unit">Mbps DOWNLOAD</div>
        <div class="grid">
            <div class="card"><span class="lbl">البنق (الخامل)</span><span id="p-idle" class="val">--</span><small>ms</small></div>
            <div class="card"><span class="lbl">البنق (المثقل)</span><span id="p-loaded" class="val">--</span><small>ms</small></div>
            <div class="card"><span class="lbl">الرفع (Upload)</span><span id="p-upload" class="val">--</span><small>Mbps</small></div>
        </div>
        <button class="btn-go" onclick="igniteTest()">ابدأ فحص المحاكاة</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
