<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V81 | DOWNLOAD MASTER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="app-shell">
        
        <div class="server-panel">
            <select id="server-selector" class="cyber-select">
                <option value="auto">⚡ رادار تلقائي (أفضل مسار سعودي)</option>
                <option value="stc">STC (Saudi Telecom)</option>
                <option value="mobily">Mobily (Etisalat)</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam (Integrated)</option>
                <option value="go">GO (Atheeb)</option>
                <option value="dawiyat">Dawiyat (Fiber)</option>
            </select>
        </div>

        <div class="gauge-engine">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-vessel">
                <svg viewBox="0 0 200 200">
                    <circle class="track-bg" cx="100" cy="100" r="90"></circle>
                    <circle id="progress-bar" class="track-fill" cx="100" cy="100" r="90"></circle>
                </svg>
                <div id="needle" class="needle-plasma"></div>
            </div>
            <div class="readout-core">
                <div id="main-value">0</div>
                <div id="test-status" class="status-msg">جاهز للاختبار</div>
                <div class="unit-label">MBPS DOWNLOAD</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card">
                <span class="lbl">البنق (الخامل)</span>
                <span id="res-ping" class="val">--</span>
                <span class="unt">ms</span>
            </div>
            <div class="res-card highlight">
                <span class="lbl">البنق (المثقل)</span>
                <span id="res-load" class="val">--</span>
                <span class="unt">ms</span>
            </div>
            <div class="res-card up-active">
                <span class="lbl">سرعة الرفع (Mbps)</span>
                <span id="res-ul" class="val">--</span>
                <span id="up-peak" class="peak-label">Peak: --</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startEliteTest()">ابدأ فحص النظام</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
