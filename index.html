<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-SPEED V65 | MODERN PRECISION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    
    <div class="master-hub">
        <div class="server-control">
            <div class="select-wrapper">
                <label for="server-selector">NODE SELECTOR</label>
                <select id="server-selector" class="modern-select">
                    <option value="auto">⚡ AUTO RADAR (BEST PING)</option>
                    <option value="stc">STC - SAUDI TELECOM</option>
                    <option value="mobily">MOBILY - ETISALAT</option>
                    <option value="zain">ZAIN - KSA</option>
                    <option value="salam">SALAM - INTEGRATED</option>
                    <option value="dawiyat">DAWIYAT - FIBER</option>
                </select>
            </div>
        </div>

        <div class="gauge-container">
            <div class="gauge-ticks">
                <span style="--i:0;">0</span>
                <span style="--i:1;">100</span>
                <span style="--i:2;">200</span>
                <span style="--i:3;">300</span>
                <span style="--i:4;">400</span>
                <span style="--i:5;">500</span>
            </div>
            
            <div class="turbine-wrap">
                <svg class="main-gauge" viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                </svg>
                <div id="needle" class="digital-needle"></div>
            </div>
            
            <div class="speed-readout">
                <div id="main-speed">0</div>
                <div class="unit" id="unit-text">DOWNLOAD MBPS</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card">
                <span class="lbl">IDLE PING</span>
                <span id="res-ping" class="val">--</span>
                <span class="unit-min">ms</span>
            </div>
            <div class="res-card active-pulse">
                <span class="lbl">LOADED PING</span>
                <span id="res-load" class="val">--</span>
                <span class="unit-min">ms</span>
            </div>
            <div class="res-card">
                <span class="lbl">UPLOAD</span>
                <span id="res-ul" class="val">--</span>
                <span class="unit-min">Mbps</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startV65()">IGNITE</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
