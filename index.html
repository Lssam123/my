<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Speed Elite V43 | Full ISP Support</title>
    <style>
        :root {
            --neon: #00f2fe;
            --bg: #020205;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .master-panel {
            width: 850px;
            background: var(--glass);
            backdrop-filter: blur(50px);
            border-radius: 60px;
            padding: 40px;
            border: 1px solid var(--border);
            text-align: center;
        }

        /* العداد مخصص للداونلود فقط */
        .gauge-section {
            position: relative;
            width: 450px;
            height: 350px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .needle {
            position: absolute;
            bottom: 38%;
            width: 3px;
            height: 135px;
            background: linear-gradient(to top, transparent, var(--neon));
            transform-origin: bottom center;
            transform: rotate(-120deg);
            transition: transform 0.6s cubic-bezier(0.1, 0.5, 0.5, 1);
            filter: drop-shadow(0 0 10px var(--neon));
        }

        .download-display {
            z-index: 10;
            margin-top: 80px;
        }

        #dl-speed {
            font-size: 5.5rem;
            font-weight: 900;
            line-height: 1;
        }

        .dl-label {
            font-size: 0.8rem;
            color: var(--neon);
            letter-spacing: 5px;
            font-weight: 900;
        }

        .btn-action {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white;
            color: black;
            border: none;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            margin: 20px 0;
        }

        .btn-action:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--neon); }
        .btn-retry { background: var(--neon); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.01);
            padding: 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .stat-card.active { border-color: var(--neon); background: rgba(0, 242, 254, 0.05); }
        .stat-card .val { font-size: 1.8rem; font-weight: 900; color: #fff; display: block; }
        .stat-card .lbl { font-size: 0.6rem; color: #555; font-weight: 900; }

        .server-select {
            background: #111;
            color: var(--neon);
            border: 1px solid #222;
            padding: 10px 25px;
            border-radius: 100px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="master-panel">
    <select id="server-select" class="server-select" onchange="manualNode()">
        <option value="auto">⚡ تحديد تلقائي (الأقرب)</option>
        <option value="stc">STC - الاتصالات السعودية</option>
        <option value="mobily">Mobily - موبايلي</option>
        <option value="zain">Zain - زين</option>
        <option value="salam">Salam - سلام</option>
        <option value="go">GO - عذيب</option>
        <option value="dawiyat">Dawiyat - ضوئيات</option>
    </select>

    <div class="gauge-section">
        <svg viewBox="0 0 400 400" style="position:absolute; width:100%; height:100%;">
            <path d="M 100 300 A 140 140 0 1 1 300 300" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
            <g fill="#333" font-size="11" font-weight="900" text-anchor="middle">
                <text x="85" y="310">0</text><text x="65" y="210">100</text>
                <text x="120" y="115">250</text><text x="200" y="90">500</text>
                <text x="285" y="115">750</text><text x="340" y="210">900</text>
                <text x="320" y="310">1000+</text>
            </g>
        </svg>
        <div id="needle" class="needle"></div>
        <div class="download-display">
            <div id="dl-speed">0</div>
            <div class="dl-label">DOWNLOAD</div>
        </div>
    </div>

    <button id="action-btn" class="btn-action" onclick="runV43()">بدء</button>

    <div class="stats-grid">
        <div class="stat-card" id="card-ping">
            <span class="lbl">البنق (Ping)</span>
            <span id="v-ping" class="val">--</span>
        </div>
        <div class="stat-card" id="card-loaded">
            <span class="lbl">المثقل (Jitter)</span>
            <span id="v-loaded" class="val">--</span>
        </div>
        <div class="stat-card" id="card-ul">
            <span class="lbl">الرفع (Upload)</span>
            <span id="v-ul" class="val">--</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
