<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V88 | LIVE FLOW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="app-frame">
        
        <div class="top-result-line">
            <div class="res-bit">
                <span class="t-lbl">PING</span>
                <span id="top-ping" class="t-val">--</span>
            </div>
            <div class="res-bit center">
                <span class="t-lbl">DOWNLOAD</span>
                <span id="top-dl" class="t-val">--</span>
            </div>
            <div class="res-bit">
                <span class="t-lbl">UPLOAD</span>
                <span id="top-ul" class="t-val">--</span>
            </div>
        </div>

        <div class="server-wrap">
            <select id="server-selector" class="live-select">
                <option value="auto">⚡ تلقائي (أفضل بنق)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
                <option value="dawiyat">Dawiyat Fiber</option>
            </select>
        </div>

        <div class="gauge-hub">
            <div class="gauge-ticks" id="gauge-ticks"></div>
            <div class="gauge-circle">
                <svg viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="grad-dl" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="grad-ul" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#a18cd1;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#fbc2eb;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <path class="track-bg" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" />
                    <path id="progress-path" class="track-fill" d="M 30 170 A 100 100 0 1 1 170 170" fill="none" stroke="url(#grad-dl)" />
                </svg>
                <div id="needle" class="needle-pointer"></div>
            </div>
            <div class="readout">
                <div id="live-speed">0</div>
                <div id="phase-txt" class="phase-txt">READY</div>
                <div class="unit">Mbps</div>
            </div>
        </div>

        <div class="live-jitter-box">
            <span class="lbl">البنق المثقل (Live Jitter):</span>
            <span id="live-loaded-ping" class="val">--</span>
            <span class="unit">ms</span>
        </div>

        <button id="start-btn" class="start-btn" onclick="runV88()">ابدأ الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
