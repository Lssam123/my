<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>S-SPEED V64 | STABLE FLOW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="master-hub">
        
        <div class="server-panel">
            <span class="panel-lbl">سيرفر البنق:</span>
            <select id="server-selector" class="cyber-select">
                <option value="auto">⚡ تلقائي (الأسرع)</option>
                <option value="stc">STC - الاتصالات السعودية</option>
                <option value="mobily">Mobily - موبايلي</option>
                <option value="zain">Zain - زين</option>
                <option value="salam">Salam - سلام</option>
                <option value="dawiyat">Dawiyat - ضوئيات</option>
                <option value="itc">ITC - المتكاملة</option>
            </select>
        </div>

        <div class="gauge-container">
            <div class="gauge-ticks">
                <span style="--i:0;">0</span>
                <span style="--i:1;">100</span>
                <span style="--i:2;">200</span>
                <span style="--i:3;">300</span>
                <span style="--i:4;">400</span>
                <span style="--i:5;">500</span>
            </div>
            
            <div class="turbine-wrap">
                <svg class="main-gauge" viewBox="0 0 200 200">
                    <circle class="track" cx="100" cy="100" r="85"></circle>
                </svg>
                <div id="needle" class="digital-needle"></div>
            </div>
            
            <div class="speed-box">
                <div id="main-speed">0</div>
                <div class="unit" id="unit-text">MBPS DOWNLOAD</div>
            </div>
        </div>

        <div class="results-matrix">
            <div class="res-card">
                <span class="lbl">IDLE PING</span>
                <span id="res-ping" class="val">--</span>
                <span class="unit-min">ms</span>
            </div>
            <div class="res-card active-pulse">
                <span class="lbl">LOADED PING</span>
                <span id="res-load" class="val">--</span>
                <span class="unit-min">ms</span>
            </div>
            <div class="res-card">
                <span class="lbl">UPLOAD</span>
                <span id="res-ul" class="val">--</span>
                <span class="unit-min">Mbps</span>
            </div>
        </div>

        <button id="ignite-btn" class="ignite-btn" onclick="startV64()">إطلاق الفحص</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
