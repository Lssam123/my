<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V108 | ABSOLUTE PRECISION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="deep-space"></div>
    
    <div class="central-hub">
        <div class="hud-top">
            <div class="hud-slot">
                <span class="hud-label">PING</span>
                <span id="res-ping" class="hud-value">-- <span class="dim">ms</span></span>
            </div>
            <div class="hud-slot middle">
                <span class="hud-label">DOWNLOAD</span>
                <span id="res-dl" class="hud-value cyan">-- <span class="dim">Mbps</span></span>
            </div>
            <div class="hud-slot">
                <span class="hud-label">UPLOAD</span>
                <span id="res-ul" class="hud-value magenta">-- <span class="dim">Mbps</span></span>
            </div>
        </div>

        <div class="server-area">
            <select id="srv-select" class="precision-select">
                <option value="auto">📡 الاستقبال التلقائي (Auto Best)</option>
                <option value="stc">STC KSA</option>
                <option value="mobily">Mobily KSA</option>
                <option value="zain">Zain KSA</option>
                <option value="salam">Salam Integrated</option>
                <option value="go">GO Telecom</option>
            </select>
        </div>

        <div class="gauge-wrapper">
            <div class="ticks-layer" id="ticks"></div>
            
            <div class="gauge-svg-layer">
                <svg viewBox="0 0 240 240"> <defs>
                        <linearGradient id="grad-dl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C9FF"/><stop offset="1" stop-color="#92FE9D"/></linearGradient>
                        <linearGradient id="grad-ul" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f80759"/><stop offset="1" stop-color="#bc4e9c"/></linearGradient>
                    </defs>
                    <path class="track-bg" d="M 40 200 A 110 110 0 1 1 200 200" fill="none" />
                    <path id="track-active" class="track-fg" d="M 40 200 A 110 110 0 1 1 200 200" fill="none" stroke="url(#grad-dl)" />
                </svg>
                <div id="needle" class="needle-arrow"></div>
            </div>
            
            <div class="gauge-info">
                <div id="live-num">0.0</div>
                <div id="phase-txt" class="status-pill">READY</div>
                <div class="unit-txt">Mbps</div>
            </div>
        </div>

        <div class="jitter-row">
            <div class="j-info">
                <span>Loaded Latency</span>
                <strong id="live-jitter" class="j-num">--</strong> ms
            </div>
            <div class="j-graph-bg"><div id="j-bar" class="j-bar-fill"></div></div>
        </div>

        <button id="start-btn" class="precision-btn" onclick="startV108()">START TEST</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
