<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-SPEED V115 | ATOMIC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div class="cyber-container">
        
        <div class="sys-header">
            <div class="sys-title">SYSTEM V.115 // ONLINE</div>
            <select id="srv-select" class="cyber-select">
                <option value="auto">⚡ TARGET: AUTO (BEST LATENCY)</option>
                <option value="stc">TARGET: STC KSA</option>
                <option value="mobily">TARGET: MOBILY</option>
                <option value="zain">TARGET: ZAIN</option>
                <option value="salam">TARGET: SALAM</option>
            </select>
        </div>

        <div class="core-grid">
            
            <div class="gauge-unit">
                <div class="circle-outer"></div>
                <div class="circle-inner"></div>
                <svg class="gauge-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="g-active" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#00ffcc"/>
                            <stop offset="100%" stop-color="#00ccff"/>
                        </linearGradient>
                    </defs>
                    <path class="track-bg" d="M 40 160 A 85 85 0 1 1 160 160" fill="none" />
                    <path id="track-main" class="track-val" d="M 40 160 A 85 85 0 1 1 160 160" fill="none" stroke="url(#g-active)" />
                </svg>
                
                <div class="digital-readout">
                    <div id="live-val">000</div>
                    <div class="unit-box">Mbps</div>
                    <div id="status-phase" class="phase-box">STANDBY</div>
                </div>
            </div>

            <div class="data-panel">
                <div class="d-row">
                    <span class="d-lbl">PING</span>
                    <span id="res-ping" class="d-val">-- ms</span>
                </div>
                <div class="d-row">
                    <span class="d-lbl">JITTER (LOAD)</span>
                    <span id="res-jitter" class="d-val warn">-- ms</span>
                </div>
                <div class="d-row">
                    <span class="d-lbl">DOWNLOAD</span>
                    <span id="res-dl" class="d-val cyan">--</span>
                </div>
                <div class="d-row">
                    <span class="d-lbl">UPLOAD</span>
                    <span id="res-ul" class="d-val pink">--</span>
                </div>
            </div>
        </div>

        <div class="sys-log" id="sys-log">
            > Initializing system...<br>
            > Waiting for user input...
        </div>

        <button id="start-btn" class="cyber-btn" onclick="startAtomicTest()">INITIATE SEQUENCE</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
